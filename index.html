            position: fixed; top: 0; left: 0; width: 100%; 
            z-index: 9999; /* رقم عالي جداً */
        }
        .login-card {
            background: rgba(10, 15, 24, 0.95); border: 2px solid var(--main-color); padding: 40px; 
            border-radius: 20px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 225, 255, 0.2); backdrop-filter: blur(10px);
            position: relative; z-index: 10000; /* عشان نضمن إنه فوق الخلفية */
        }
        .login-logo { font-size: 2.5rem; font-weight: 900; color: var(--main-color); margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 15px var(--main-color); }
        .login-input {
            width: 100%; padding: 15px; background: #000; border: 1px solid #333; 
            border-radius: 50px; color: #fff; text-align: center; font-size: 1.2rem; outline: none; margin-bottom: 20px;
            position: relative; z-index: 10001; /* فوق الكارد */
        }
        .login-btn {
            width: 100%; padding: 15px; background: var(--main-color); color: #000; border: none; 
            border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s;
            position: relative; z-index: 10001; /* فوق الكارد */
        }
        .login-btn:hover { background: #fff; box-shadow: 0 0 20px var(--main-color); }
        .login-btn:active { transform: scale(0.98); }
        .error-msg { color: #ff3333; margin-top: 15px; font-weight: bold; display: none; }

        /* --- شاشة الترحيب --- */
        #welcomeSection {
            display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center;

        .welcome-text { margin-top: 20px; color: #888; font-size: 1.1rem; }

        #platformSection { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--main-color);
            position: relative;
            display: flex; justify-content: space-between; align-items: center;
        }

        h1 { margin: 0; color: var(--main-color); font-size: 2rem; text-shadow: 0 0 15px var(--main-color); font-weight: 900; }
        
        .header-icons { display: flex; gap: 10px; }
        .icon-btn { 
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--main-color); 
            display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer;
        }
        .logout-btn { border-color: #ff3333; color: #ff3333; }

        #backBtn {
            display: none;
            background-color: transparent;
            color: var(--main-color);
            border: 2px solid var(--main-color);
            padding: 8px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        #backBtn:hover { background-color: var(--main-color); color: #000; }

        h2#sectionTitle { color: #fff; border-right: 4px solid var(--main-color); padding-right: 10px; margin-bottom: 20px; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid rgba(0, 225, 255, 0.15);

            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(0, 225, 255, 0.2);
            border-color: var(--main-color);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        /* تنسيق خاص لكروت المجلدات/الكورسات */
        .folder-card .card-img {
            height: 140px; 
            object-fit: contain;
            padding: 20px;
            background: #000;
        }

        .card-body { padding: 20px; text-align: center; }
        .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .card-desc { font-size: 0.9rem; color: #888; }

        /* تنسيق الفيديو */
        .video-wrapper {
            max-width: 800px;
            margin: 0 auto 40px auto;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #333;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        
        .video-info { padding: 20px; background: #111; border-bottom: 1px solid #333; }
        .video-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; color: var(--main-color); }
        .video-desc { color: #aaa; }
        
        /* تحسين شكل Plyr */
        .plyr--video {
            border-radius: 0 0 16px 16px;
            --plyr-color-main: #00e1ff;
        }
        
        /* إخفاء عناصر يوتيوب المزعجة */
        .plyr__video-embed iframe {
            top: -50%;
            height: 200%;
        }

        /* مودال */
        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .modal-content { background: #0f121a; border: 1px solid var(--main-color); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; position: relative; }
        .close { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 22px; cursor: pointer; }
        .chat-box { height: 300px; overflow-y: auto; background: #000; padding: 10px; margin-bottom: 10px; border-radius: 10px; text-align: right; }
        .msg { background: #333; padding: 5px 10px; border-radius: 10px; margin-bottom: 5px; display: inline-block; }
        .msg.me { background: var(--main-color); color: #000; }
        .timer { font-family: monospace; font-size: 1.2rem; margin-top: 10px; color: #fff; }

    </style>
</head>

        let countTimer;

        window.onload = function() {
            const savedUser = localStorage.getItem('fullmark_user');
            if(savedUser) {
                startCountdown();
            } else {
                document.getElementById('loginSection').style.display = 'flex';
            }
        };

        function checkCode() {
            const code = document.getElementById('codeParams').value.trim();
            const msg = document.getElementById('loginMsg');
            const btn = document.querySelector('.login-btn');

            if(!code) { msg.innerText = "اكتب الكود!"; msg.style.display = 'block'; return; }
            
            btn.innerText = "جاري التحقق...";
            msg.style.display = 'none';

            // الكود السحري
            if(code === '123456') {
                localStorage.setItem('fullmark_user', code);
                startCountdown();
                return;
            }

            // الفايربيز (البحث عن الكود)
            db.collection('codes').where('code', '==', code).get().then(snap => {
                if(snap.empty) {
                    msg.innerText = "❌ الكود غير صحيح!";
                    msg.style.display = 'block';
                    btn.innerText = "دخول";
                } else {
                    localStorage.setItem('fullmark_user', code);
                    startCountdown();
                }
            }).catch(e => {
                console.error(e); // شوف المشكلة في الكونسول
                msg.innerText = "⚠️ مشكلة اتصال: " + e.message;
                msg.style.display = 'block';
                btn.innerText = "دخول";
            });
        }

        function startCountdown() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('welcomeSection').style.display = 'flex';
            
            let count = 5;
            const el = document.getElementById('counter');
            el.innerText = count;

            countTimer = setInterval(() => {
                count--;
                el.innerText = count;
                if(count <= 0) {
                    clearInterval(countTimer);
                    document.getElementById('welcomeSection').style.display = 'none';
                    document.getElementById('platformSection').style.display = 'block';
                    loadAndMerge(); // حمل الداتا
                }
            }, 1000);
        }

        function cancelLogin() {
            clearInterval(countTimer);
            localStorage.removeItem('fullmark_user');
            location.reload();

                    if(!sub) { sub = { name: v.subject, image: v.subImg || "https://cdn-icons-png.flaticon.com/512/2997/2997380.png", teachers: [] }; platformData.push(sub); }
