<html lang="ar" dir="rtl">

    <style>
        :root {
            /* الألوان الجديدة: أزرق ثلجي */
            --main-color: #0ea5e9;
            --dark-blue: #0284c7;
            --gradient-bg: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            --story-gradient: linear-gradient(45deg, #0ea5e9, #6366f1);
            --card-bg: #ffffff;
            --text-color: #334155;
            --shadow: 0 10px 30px -10px rgba(14, 165, 233, 0.15);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--gradient-bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ==============================
           تصميم صفحة الدخول (Story Style)
           ============================== */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--story-gradient);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .login-logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .login-sub { opacity: 0.9; margin-bottom: 30px; }

        .code-input {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 1.2rem;
            font-family: 'Cairo', sans-serif;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .code-input:focus { transform: scale(1.05); }

        .login-btn {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: none;
            background: white;
            color: #0ea5e9;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .login-btn:hover { background: #f0f9ff; transform: scale(1.02); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        #errorMsg {
            color: #ffcccc;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
            font-weight: bold;
        }

        /* ==============================
           تصميم المنصة الداخلي
           ============================== */
        #mainPlatform { display: none; padding: 20px; }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: white;
            border-radius: 25px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: var(--story-gradient);
        }

        h1 { margin: 0; color: var(--dark-blue); font-size: 2.2rem; }
        
        #backBtn {
            display: none;
            background: var(--story-gradient);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 25px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
            font-family: 'Cairo', sans-serif;
        }
        #backBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4); }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding-bottom: 50px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(226, 232, 240, 0.6);
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -5px rgba(14, 165, 233, 0.2);
            border-color: var(--main-color);
        }

        .card-img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            transition: 0.3s;
        }
        
        .card:hover .card-img { transform: scale(1.05); }

        .folder-card .card-img {
            height: 150px; 
            object-fit: contain;
            padding: 25px;
            background: #f0f9ff;
        }

        .card-body { padding: 25px; text-align: center; position: relative; background: white; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--dark-blue); }
        .card-desc { font-size: 0.95rem; color: #64748b; }

        /* تنسيق الفيديو */
        .video-wrapper {
            max-width: 900px;
            margin: 0 auto 40px auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid #e2e8f0;
        }
        
        .video-info { padding: 25px; }
        .video-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; color: var(--dark-blue); }
        
        .plyr--video {
            border-radius: 20px 20px 0 0;
            --plyr-color-main: #0ea5e9;
        }
        
        .plyr__video-embed iframe { top: -50%; height: 200%; }

    </style>
</head>

            <button id="loginBtn" class="login-btn" onclick="checkLogin()">دخول 🚀</button>
            <div id="errorMsg">الكود غير صحيح</div>

        <header>
            <h1>💎 Full Mark Two</h1>
            <p style="color: #64748b; margin-top: 5px;">رحلتك نحو التفوق</p>
        </header>

        <div style="max-width: 1200px; margin: 0 auto;">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds",
            authDomain: "full-mark-8d434.firebaseapp.com",
            projectId: "full-mark-8d434",
            storageBucket: "full-mark-8d434.firebasestorage.app",
            messagingSenderId: "802579483999",
            appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea",
            measurementId: "G-26F9W89TB8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ========================
        // دالة فحص الكود من الفايربيز
        // ========================
        window.checkLogin = async () => {
            const input = document.getElementById('accessCode').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            if(!input) return;

            // تغيير حالة الزر أثناء التحميل
            loginBtn.innerText = "جاري التحقق...";
            loginBtn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                // البحث في الكولكشن "codes" عن الكود المكتوب
                const q = query(collection(db, "codes"), where("code", "==", input));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    // الكود صحيح وموجود
                    const overlay = document.getElementById('loginOverlay');
                    overlay.style.opacity = '0';
                    overlay.style.transition = 'opacity 0.5s';
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        document.getElementById('mainPlatform').style.display = 'block';
                    }, 500);
                } else {
                    // الكود غلط
                    showError();
                }
            } catch (error) {
                console.error("Error logging in:", error);
                errorMsg.innerText = "حدث خطأ في الاتصال، تأكد من الإنترنت";
                errorMsg.style.display = 'block';
            } finally {
                loginBtn.innerText = "دخول 🚀";
                loginBtn.disabled = false;
            }
        }

        function showError() {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = "الكود غير صحيح أو منتهي الصلاحية";
            errorMsg.style.display = 'block';
            
            const card = document.querySelector('.login-card');
            card.style.animation = 'shake 0.5s';
            setTimeout(() => card.style.animation = 'none', 500);
        }

        window.handleEnter = (e) => {
            if(e.key === 'Enter') checkLogin();
        }

        // ستايل الاهتزاز عند الخطأ
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes shake {
                0% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                50% { transform: translateX(10px); }
                75% { transform: translateX(-10px); }
                100% { transform: translateX(0); }
            }
        `;
        document.head.appendChild(styleSheet);
    </script>

        // ==========================================
        // 2. منطق العرض
        // ==========================================

        const contentArea = document.getElementById('contentArea');
        const sectionTitle = document.getElementById('sectionTitle');
        const backBtn = document.getElementById('backBtn');
        
        let state = {
            level: 'subjects',
            subjectIdx: null,
            teacherIdx: null,
            folderIdx: null
        };

        function showSubjects() {
            state.level = 'subjects';
            sectionTitle.innerText = "المواد المتاحة";
            backBtn.style.display = 'none';
            contentArea.className = "grid-container";
            contentArea.innerHTML = '';

            platformData.forEach((subject, index) => {
                contentArea.innerHTML += `
                    <div class="card" onclick="showTeachers(${index})">
                        <img src="${subject.image}" class="card-img" alt="${subject.name}">
                        <div class="card-body">
                            <div class="card-title">${subject.name}</div>
                            <div class="card-desc">اضغط لعرض المدرسين 👨‍🏫</div>
                        </div>
                    </div>
                `;
            });
        }

        function showTeachers(idx) {
            state.level = 'teachers';
            state.subjectIdx = idx;
            const subject = platformData[idx];
            
            sectionTitle.innerText = `مدرسين مادة ${subject.name}`;
            backBtn.style.display = 'inline-block';
            contentArea.className = "grid-container";
            contentArea.innerHTML = '';

            if(subject.teachers.length === 0) contentArea.innerHTML = '<p>لا يوجد بيانات.</p>';

            subject.teachers.forEach((teacher, tIndex) => {
                contentArea.innerHTML += `
                    <div class="card" onclick="showFolders(${tIndex})">
                        <img src="${teacher.image}" class="card-img" alt="${teacher.name}">
                        <div class="card-body">
                            <div class="card-title">${teacher.name}</div>
                            <div class="card-desc">تصفح الكورسات 📚</div>
                        </div>
                    </div>
                `;
            });
        }

        function showFolders(tIndex) {
            state.level = 'folders';
            state.teacherIdx = tIndex;
            const teacher = platformData[state.subjectIdx].teachers[tIndex];
            
            sectionTitle.innerText = `كورسات: ${teacher.name}`;
            contentArea.className = "grid-container";
            contentArea.innerHTML = '';

            if(!teacher.folders || teacher.folders.length === 0) {
                contentArea.innerHTML = '<p>لا يوجد كورسات حالياً.</p>';
                return;
            }

            teacher.folders.forEach((folder, fIndex) => {
                contentArea.innerHTML += `
                    <div class="card folder-card" onclick="showVideos(${fIndex})">
                        <img src="${folder.image}" class="card-img" alt="Folder">
                        <div class="card-body">
                            <div class="card-title">${folder.title}</div>
                            <div class="card-desc">${folder.videos.length} فيديوهات 🎬</div>
                        </div>
                    </div>
                `;
            });
        }

        function showVideos(fIndex) {
            state.level = 'videos';
            state.folderIdx = fIndex;
            const folder = platformData[state.subjectIdx].teachers[state.teacherIdx].folders[fIndex];
            
            sectionTitle.innerText = folder.title;
            contentArea.className = ""; 
            contentArea.innerHTML = '';

            folder.videos.forEach((video, vIndex) => {
                contentArea.innerHTML += `
