<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلاب | Full Mark</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #fff; font-family: 'Cairo'; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 50px auto; background: #111; padding: 30px; border-radius: 15px; border: 1px solid #333; }
        h2 { color: #00e1ff; margin-bottom: 20px; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; outline: none; text-align: center; font-size: 1.1rem; }
        input:focus { border-color: #00e1ff; }
        
        button { width: 100%; padding: 15px; margin-top: 15px; background: #00e1ff; color: #000; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 1.1rem; }
        
        .result { margin-top: 20px; padding: 15px; background: #0a1f25; border: 1px dashed #00e1ff; display: none; }
        .code-display { font-size: 2rem; letter-spacing: 5px; font-family: monospace; color: #fff; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="container">
        <h2>👤 تسجيل طالب جديد</h2>
        <input type="text" id="studentName" placeholder="اسم الطالب الثلاثي">
        <button onclick="generateCode()">توليد كود تفعيل</button>
        
        <div id="result" class="result">
            <p>تم إنشاء الكود بنجاح:</p>
            <div id="finalCode" class="code-display"></div>
            <p style="color:#aaa; font-size:0.9rem;">انسخ الكود واديه للطالب</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        // نفس بيانات الفايربيز بتاعتك بالظبط
        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        function generateCode() {
            const name = document.getElementById('studentName').value.trim();
            if(!name) return alert("اكتب اسم الطالب الأول!");

            // توليد كود عشوائي من 6 أرقام
            const code = Math.floor(100000 + Math.random() * 900000).toString();

            // حفظ الكود في الفايربيز
            db.collection('codes').add({
                code: code,
                studentName: name,
                createdAt: new Date(),
                active: true
            }).then(() => {
                document.getElementById('result').style.display = 'block';
                document.getElementById('finalCode').innerText = code;
                document.getElementById('studentName').value = ''; // فضي الخانة
            }).catch((error) => {
                alert("حصل خطأ: " + error.message);
            });
        }
    </script>
</body>
</html>
