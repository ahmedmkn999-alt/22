<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ذاكرلي | Player Hub</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --main: #00e1ff; --bg: #02050a; --card-bg: #0a0f18; --text: #fff; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: linear-gradient(135deg, #02050a 0%, #050a14 100%); color: var(--text); min-height: 100vh; overflow-x: hidden; margin: 0; }

        /* شاشة الدخول */
        #loginSection {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a2332 0%, #000000 100%);
            position: fixed; top: 0; left: 0; width: 100%; z-index: 2000;
        }
        .login-card {
            background: rgba(10, 15, 24, 0.95); border: 2px solid var(--main); padding: 40px; 
            border-radius: 20px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 225, 255, 0.2); backdrop-filter: blur(10px);
        }
        .login-logo { font-size: 2.5rem; font-weight: 900; color: var(--main); margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 15px var(--main); }
        .login-input {
            width: 100%; padding: 15px; background: #000; border: 1px solid #333; 
            border-radius: 50px; color: #fff; text-align: center; font-size: 1.2rem; outline: none; margin-bottom: 20px;
        }
        .login-btn {
            width: 100%; padding: 15px; background: var(--main); color: #000; border: none; 
            border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .login-btn:hover { box-shadow: 0 0 20px var(--main); background: #fff; }
        
        /* شاشة الترحيب */
        #welcomeSection {
            display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center;
            background: #000; position: fixed; top: 0; left: 0; width: 100%; z-index: 1999;
        }
        .counter-circle {
            width: 120px; height: 120px; border: 5px solid var(--main); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; font-weight: bold; color: #fff; text-shadow: 0 0 20px var(--main);
            box-shadow: 0 0 30px rgba(0, 225, 255, 0.3); animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }
        .welcome-text { margin-top: 20px; color: #888; font-size: 1.1rem; }

        /* المنصة */
        #platformSection { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

        header {
            text-align: center; margin-bottom: 30px; padding-bottom: 20px;
            border-bottom: 2px solid var(--main); position: relative;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-text { color: var(--main); font-size: 1.8rem; text-shadow: 0 0 15px var(--main); font-weight: 900; }
        .header-icons { display: flex; gap: 10px; }
        .icon-btn { 
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--main); 
            display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer;
        }
        .logout-btn { border-color: #ff3333; color: #ff3333; }

        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        #backBtn {
            display: none; background: transparent; color: var(--main);
            border: 2px solid var(--main); padding: 5px 20px; border-radius: 50px;
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        #backBtn:hover { background-color: var(--main); color: #000; }

        h2#sectionTitle { color: #fff; border-right: 4px solid var(--main); padding-right: 10px; margin: 0; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding-bottom: 50px; }

        .card {
            background-color: var(--card-bg); border-radius: 16px; overflow: hidden;
            border: 1px solid rgba(0, 225, 255, 0.15); transition: 0.3s; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .card:active { transform: scale(0.97); border-color: var(--main); }
        .card-img-container { width: 100%; height: 160px; background: #000; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .card-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-body { padding: 15px; text-align: center; }
        .card-title { font-size: 1rem; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .card-desc { font-size: 0.8rem; color: #888; }

        .video-list { display: flex; flex-direction: column; gap: 25px; }
        .video-wrapper { background: #000; border-radius: 16px; overflow: hidden; border: 1px solid #333; position: relative; }
        .video-info { padding: 15px; background: #111; border-bottom: 1px solid #333; }
        .video-title { font-size: 1.1rem; font-weight: bold; color: var(--main); }
        .watermark { position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.3); font-size: 1.5rem; font-weight: bold; pointer-events: none; z-index: 100; animation: float 6s infinite alternate; }
        @keyframes float { 0% {top:10%;left:10%} 100% {top:80%;left:80%} }

        /* مودال */
        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .modal-content { background: #0f121a; border: 1px solid var(--main); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; position: relative; }
        .close { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 22px; cursor: pointer; }
        .chat-box { height: 300px; overflow-y: auto; background: #000; padding: 10px; margin-bottom: 10px; border-radius: 10px; text-align: right; }
        .msg { background: #333; padding: 5px 10px; border-radius: 10px; margin-bottom: 5px; display: inline-block; }
        .msg.me { background: var(--main); color: #000; }
        .timer { font-family: monospace; font-size: 1.2rem; margin-top: 10px; color: #fff; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loginSection">
        <div class="login-card">
            <div class="login-logo">ذاكرلي</div>
            <p style="color:#888; margin-bottom:20px;">أدخل كود الطالب</p>
            <input type="text" id="codeParams" class="login-input" placeholder="الكود هنا" autocomplete="off">
            <button class="login-btn" onclick="checkCode()">دخول</button>
            <p style="color:#555; font-size:0.8rem; margin-top:10px;">كود التجربة: 123456</p>
        </div>
    </div>

    <div id="welcomeSection">
        <div class="counter-circle" id="counter">5</div>
        <div class="welcome-text">جاري تجهيز محتواك التعليمي...</div>
        <button onclick="cancelLogin()" style="margin-top:20px; background:none; border:1px solid #555; color:#777; padding:5px 15px; border-radius:20px; cursor:pointer;">تغيير الحساب</button>
    </div>

    <div id="platformSection">
        <header>
            <div class="logo-text">ذاكرلي</div>
            <div class="header-icons">
                <div class="icon-btn" onclick="openSupport()"><i class="fas fa-headset"></i></div>
                <div class="icon-btn" onclick="openProfile()"><i class="fas fa-user"></i></div>
                <div class="icon-btn logout-btn" onclick="logout()"><i class="fas fa-power-off"></i></div>
            </div>
        </header>

        <div style="max-width: 1200px; margin: 0 auto;">
            <div class="nav-bar">
                <h2 id="sectionTitle">اختر المادة</h2>
                <button id="backBtn" onclick="goBack()">🔙 رجوع</button>
            </div>
            <div id="contentArea" class="grid-container"></div>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('profileModal')">&times;</span>
            <h3 style="color:var(--main)">الملف الشخصي</h3>
            <div id="pName" style="font-size:1.5rem; font-weight:bold; margin:10px 0;">...</div>
            <div id="pCode" style="color:#888; font-family:monospace;">...</div>
            <div class="timer" id="countdown">...</div>
        </div>
    </div>

    <div id="supportModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('supportModal')">&times;</span>
            <h3>الدعم الفني</h3>
            <div class="chat-box" id="chatBody"></div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="chatInput" style="flex:1; padding:10px; border-radius:5px; border:none;" placeholder="رسالتك...">
                <button onclick="sendMsg()" style="padding:10px; background:var(--main); border:none; border-radius:5px;">إرسال</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        // --- نظام الدخول الذكي ---
        let countTimer;

        // عند فتح الصفحة، شوف لو مسجل قبل كدة
        window.onload = function() {
            const savedUser = localStorage.getItem('fullmark_user');
            if(savedUser) {
                // لو مسجل، شغل العداد علطول
                startCountdown();
            } else {
                // لو مش مسجل، اظهر الدخول
                document.getElementById('loginSection').style.display = 'flex';
            }
        };

        function checkCode() {
            const code = document.getElementById('codeParams').value.trim();
            const btn = document.querySelector('.login-btn');

            if(!code) { alert("اكتب الكود!"); return; }
            
            btn.innerText = "جاري التحقق...";

            // الكود السحري للتجربة (عشان تدخلي فوراً)
            if(code === '123456') {
                localStorage.setItem('fullmark_user', code);
                startCountdown();
                return;
            }

            // البحث في الفايربيز
            db.collection('codes').where('code', '==', code).get().then(snap => {
                if(snap.empty) {
                    alert("❌ الكود غلط! تأكد من الكود أو جرب 123456");
                    btn.innerText = "دخول";
                } else {
                    localStorage.setItem('fullmark_user', code);
                    startCountdown();
                }
            }).catch(e => {
                alert("⚠️ مشكلة في النت: " + e.message);
                btn.innerText = "دخول";
            });
        }

        function startCountdown() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('welcomeSection').style.display = 'flex';
            
            let count = 5;
            const el = document.getElementById('counter');
            el.innerText = count;

            countTimer = setInterval(() => {
                count--;
                el.innerText = count;
                if(count <= 0) {
                    clearInterval(countTimer);
                    document.getElementById('welcomeSection').style.display = 'none';
                    document.getElementById('platformSection').style.display = 'block';
                    loadAndMerge(); // حمل الداتا
                }
            }, 1000);
        }

        function cancelLogin() {
            clearInterval(countTimer);
            localStorage.removeItem('fullmark_user');
            document.getElementById('welcomeSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'flex';
            document.querySelector('.login-btn').innerText = "دخول";
        }

        function logout() {
            localStorage.removeItem('fullmark_user');
            location.reload();
        }

        // --- منطق المنصة (الداتا والعرض) ---
        let platformData = [
          {
            "id": 1, "name": "الفرنساوي", "image": "https://i.postimg.cc/NjRcy2s0/a75e136b-7909-485f-95e8-862fddd2c0bc.png", 
            "teachers": [
              {
                "id": 101, "name": "مسيو انس السعيد", "image": "https://i.postimg.cc/sDdy3JyV/lhctmi-Qt-ANEg0PDcec-CE1QTCqr-Kza-Eq-GZ6s-Zt-MJ4.jpg",
                "folders": [
                  { "id": "f1", "title": "كورس شرح المنهج 2026", "image": "https://cdn-icons-png.flaticon.com/512/3767/3767084.png", "videos": [ { "title": "جزء واحد تالتة ثانوي", "desc": "بداية المنهج", "vid": "3PC1fxpp-Xk" }, { "title": "جزء اتنين", "desc": "استكمال الشرح", "vid": "fVJTHj5YW7Y" } ] }
                ]
              }
            ]
          },
          {
            "id": 2, "name": "الإيطالي", "image": "https://i.postimg.cc/VkX8S0fb/Hotels-near-the-Colosseum.jpg",
            "teachers": [
              {
                "id": 201, "name": "سنيور مدحت غانم", "image": "https://i.postimg.cc/0NQ1VWGy/hqdefault.jpg",
                "folders": [ { "id": "f2", "title": "مراجعات ليلة الامتحان", "image": "https://cdn-icons-png.flaticon.com/512/2921/2921226.png", "videos": [ { "title": "الإنقاذ: المنهج كامل", "desc": "المنهج كله", "vid": "T6hpZH5AMnk" } ] } ]
              }
            ]
          },
          {
            "id": 3, "name": "الألماني", "image": "https://i.postimg.cc/bw1hGSyS/52023310-702.jpg",
            "teachers": [ { "id": 301, "name": "هير ياسين ابو الزيد", "image": "https://i.postimg.cc/MHkkKzCd/hqdefault-(1).jpg", "folders": [ { "id": "f3", "title": "كورس التأسيس", "image": "https://cdn-icons-png.flaticon.com/512/3767/3767084.png", "videos": [ { "title": "الأساسيات", "desc": "بداية اللغة", "vid": "JOLc4Jc9yFU" } ] } ] } ]
          },
          {
            "id": 4, "name": "الإسباني", "image": "https://i.postimg.cc/L8jpqg95/250px-Flag-of-Spain-svg.png",
            "teachers": [ { "id": 401, "name": "سنيور ماجد فارس", "image": "https://i.postimg.cc/jdbVpdQ5/FB-IMG-1770239115997.jpg", "folders": [ { "id": "f4", "title": "المراجعة النهائية", "image": "https://cdn-icons-png.flaticon.com/512/2921/2921226.png", "videos": [ { "title": "شرح المنهج", "desc": "فيديو واحد", "vid": "K9ZOydc1cqs" } ] } ] } ]
          }
        ];

        async function loadAndMerge() {
            try {
                const snap = await db.collection('new_videos').get();
                snap.forEach(doc => {
                    const v = doc.data();
                    let sub = platformData.find(s => s.name === v.subject);
                    if(!sub) { sub = { name: v.subject, image: v.subImg || "https://cdn-icons-png.flaticon.com/512/2997/2997380.png", teachers: [] }; platformData.push(sub); }
                    
                    let teacher = sub.teachers.find(t => t.name === v.teacher);
                    if(!teacher) { teacher = { name: v.teacher, image: v.techImg || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png", folders: [] }; sub.teachers.push(teacher); }
                    
                    let folder = teacher.folders.find(f => f.title === v.course);
                    if(!folder) { folder = { title: v.course, image: "https://cdn-icons-png.flaticon.com/512/3767/3767084.png", videos: [] }; teacher.folders.push(folder); }
                    
                    folder.videos.push({ title: v.videoName, desc: "تمت إضافته حديثاً", vid: v.videoLink, type: "hls" });
                });
                renderSubjects();
            } catch(e) { console.log(e); renderSubjects(); }
        }

        // --- منطق العرض والتنقل ---
        const contentArea = document.getElementById('contentArea');
        const sectionTitle = document.getElementById('sectionTitle');
        const backBtn = document.getElementById('backBtn');
        let state = { level: 'subjects', subjectIdx: null, teacherIdx: null, folderIdx: null };

        function renderSubjects() {
            state.level = 'subjects';
            sectionTitle.innerText = "اختر المادة";
            backBtn.style.display = 'none';
            contentArea.className = "grid-container";
            contentArea.innerHTML = platformData.map((sub, i) => `
                <div class="card" onclick="renderTeachers(${i})">
                    <div class="card-img-container"><img src="${sub.image}" class="card-img"></div>
                    <div class="card-body"><div class="card-title">${sub.name}</div></div>
                </div>
            `).join('');
        }

        window.renderTeachers = function(idx) {
            state.level = 'teachers'; state.subjectIdx = idx;
            const sub = platformData[idx];
            sectionTitle.innerText = sub.name;
            backBtn.style.display = 'block';
            contentArea.innerHTML = sub.teachers.map((t, i) => `
                <div class="card" onclick="renderFolders(${i})">
                    <div class="card-img-container"><img src="${t.image}" class="card-img"></div>
                    <div class="card-body"><div class="card-title">${t.name}</div></div>
                </div>
            `).join('');
        }

        window.renderFolders = function(idx) {
            state.level = 'folders'; state.teacherIdx = idx;
            const t = platformData[state.subjectIdx].teachers[idx];
            sectionTitle.innerText = t.name;
            contentArea.innerHTML = t.folders.map((f, i) => `
                <div class="card folder-card" onclick="renderVideos(${i})">
                    <div class="card-img-container"><img src="${f.image}" class="card-img"></div>
                    <div class="card-body"><div class="card-title">${f.title}</div><div class="card-desc">${f.videos.length} فيديوهات</div></div>
                </div>
            `).join('');
        }

        window.renderVideos = function(idx) {
            state.level = 'videos'; state.folderIdx = idx;
            const f = platformData[state.subjectIdx].teachers[state.teacherIdx].folders[idx];
            sectionTitle.innerText = f.title;
            contentArea.className = "video-list";
            const userCode = localStorage.getItem('fullmark_user');

            contentArea.innerHTML = f.videos.map((v, i) => `
                <div class="video-wrapper">
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                        <div class="video-desc">${v.desc}</div>
                    </div>
                    <div class="plyr__video-embed" id="player-${i}">
                        ${v.type === 'hls' || v.vi
