<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذاكرلي | تجربة الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        body { background: #000; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Cairo'; margin: 0; }
        .box { background: #111; padding: 40px; border-radius: 20px; text-align: center; border: 1px solid #00e1ff; width: 90%; max-width: 400px; }
        input { width: 100%; padding: 15px; margin: 20px 0; background: #000; border: 1px solid #444; color: #fff; text-align: center; font-size: 1.2rem; border-radius: 10px; outline: none; }
        button { width: 100%; padding: 15px; background: #00e1ff; border: none; font-weight: bold; font-size: 1.2rem; border-radius: 10px; cursor: pointer; }
        .error { color: #ff3333; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h1>ذاكرلي</h1>
        <p>نظام الدخول المباشر</p>
        <input type="text" id="code" placeholder="أدخل الكود: 123456">
        <button onclick="directLogin()">دخول</button>
        <div id="error" class="error"></div>
    </div>

    <script>
        // دالة الدخول المباشر (بدون فايربيز للتجربة)
        function directLogin() {
            const code = document.getElementById('code').value.trim();
            const err = document.getElementById('error');

            if (!code) {
                err.innerText = "اكتب الكود يا هندسة!";
                err.style.display = "block";
                return;
            }

            // الكود السحري
            if (code === "123456") {
                alert("🎉 مبروك! الزرار شغال والكود صح.");
                // حفظ الدخول
                localStorage.setItem('fullmark_user', code);
                // توجيه للمنصة (تأكد إن ملف index.html موجود جنبه)
                window.location.href = "index.html";
            } else {
                err.innerText = "❌ الكود غلط، جرب 123456";
                err.style.display = "block";
            }
        }
    </script>
</body>
</html>
