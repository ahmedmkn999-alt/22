<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Full Mark | Player Hub</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        :root {
            --main-color: #2563eb;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --plyr-color-main: #2563eb; /* لون المشغل */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { margin: 0; color: var(--main-color); }
        
        #backBtn {
            display: none;
            background-color: #fff;
            color: var(--main-color);
            border: 2px solid var(--main-color);
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        #backBtn:hover { background-color: var(--main-color); color: #fff; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            cursor: pointer;
            border: 1px solid #e5e7eb;
        }

        .card:hover { transform: translateY(-5px); }

        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #ddd; /* لون رمادي لو الصورة محملتش */
        }

        .card-body { padding: 15px; text-align: center; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .card-desc { font-size: 0.9rem; color: #666; }

        /* تنسيق كارت الفيديو */
        .video-card { cursor: default; }
        .video-card:hover { transform: none; }
        
        /* تعديل شكل المشغل ليملأ الكارت */
        .plyr {
            border-radius: 12px 12px 0 0;
            --plyr-color-main: #2563eb;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎓 Full Mark Platform</h1>
    </header>

    <div style="max-width: 1200px; margin: 0 auto;">
        <button id="backBtn" onclick="goBack()">🔙 رجوع</button>
        <h2 id="sectionTitle">اختر المادة</h2>
        <div id="contentArea" class="grid-container"></div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        // ==========================================
        // هام: يرجى تغيير روابط الصور بروابط مباشرة من (Imgur أو Postimages)
        // روابط جوجل درايف لا تعمل بشكل جيد مع المواقع
        // ==========================================
        
        const platformData = [
          {
            "id": 1,
            "name": "الفرنساوي",
            "image": "https://drive.google.com/uc?export=view&id=1eaT_568MiRvpWE2r1BxQlIQ6i3XFKWNH", 
            "teachers": [
              {
                "id": 101,
                "name": "مسيو انس السعيد",
                "image": "https://drive.google.com/uc?export=view&id=1BbfYT3HO1PXka2lTWpZLf-fbmVQVphyh",
                "courses": [
                  { "id": 1001, "title": "جزء واحد تالتة ثانوي", "description": "بداية المنهج والقواعد الأساسية.", "video_id": "3PC1fxpp-Xk" },
                  { "id": 1002, "title": "جزء اتنين تالتة ثانوي", "description": "استكمال الشرح والتدريبات.", "video_id": "fVJTHj5YW7Y" },
                  { "id": 1003, "title": "جزء تلاتة تالتة ثانوي", "description": "شرح متقدم وملاحظات هامة.", "video_id": "Afx9AHypc7M" },
                  { "id": 1004, "title": "الجزء الاخير تالتة ثانوي", "description": "ختام المنهج والمراجعة.", "video_id": "6s_TWiP1KgQ" }
                ]
              }
            ]
          },
          {
            "id": 2,
            "name": "الإيطالي",
            "image": "https://drive.google.com/uc?export=view&id=13UWkwfG-hrFFpBZvnsuSzqaZP-0I1KFa",
            "teachers": [
              {
                "id": 201,
                "name": "سنيور مدحت غانم",
                "image": "https://drive.google.com/uc?export=view&id=1Khj4-GsrBQiwylSjK_K8fL0ssKx9nB5K",
                "courses": [
                  { "id": 2001, "title": "الإنقاذ: منهج الإيطالي كاملاً", "description": "المنهج كله في 5 ساعات بس.", "video_id": "T6hpZH5AMnk" }
                ]
              }
            ]
          },
          {
            "id": 3,
            "name": "الألماني",
            "image": "https://drive.google.com/uc?export=view&id=1OgKm7oBIMxqySlFrvvlFUQfqRUYw-Cra",
            "teachers": [
              {
                "id": 301,
                "name": "هير ياسين ابو الزيد",
                "image": "https://drive.google.com/uc?export=view&id=1rBiSJiaQ0tBu1a25JsdpmNKlsasUwm0U",
                "courses": [
                  { "id": 3001, "title": "اللغة الألمانية - ج1", "description": "الأساسيات وقواعد النطق.", "video_id": "JOLc4Jc9yFU" },
                  { "id": 3002, "title": "اللغة الألمانية - ج2", "description": "الجراماتيك وتريكات الامتحانات.", "video_id": "L2irLAg7jHM" },
                  { "id": 3003, "title": "اللغة الألمانية - ج3", "description": "المواقف الحياتية.", "video_id": "I-3VLcEoCP8" },
                  { "id": 3004, "title": "اللغة الألمانية - ج4", "description": "حل تدريبات شاملة.", "video_id": "oRopKQ63a-I" }
                ]
              }
            ]
          },
          {
            "id": 4,
            "name": "الإسباني",
            "image": "https://drive.google.com/uc?export=view&id=1ysyd0XyK_WIqq-FNC55IOULpRyp_5wkI",
            "teachers": [
              {
                "id": 401,
                "name": "سنيور ماجد فارس",
                "image": "https://drive.google.com/uc?export=view&id=1wNa11MxJbDOiY5VNRXD-6sKIVoROvYXY",
                "courses": [
                  { "id": 4001, "title": "شرح المنهج كاملاً", "description": "فيديو واحد فيه الخلاصة.", "video_id": "K9ZOydc1cqs" }
                ]
              }
            ]
          }
        ];

        const contentArea = document.getElementById('contentArea');
        const sectionTitle = document.getElementById('sectionTitle');
        const backBtn = document.getElementById('backBtn');
        
        let currentLevel = 'subjects'; 
        let currentSubjectIndex = null;

        function showSubjects() {
            currentLevel = 'subjects';
            sectionTitle.innerText = "اختر المادة";
            backBtn.style.display = 'none';
            contentArea.innerHTML = '';

            platformData.forEach((subject, index) => {
                contentArea.innerHTML += `
                    <div class="card" onclick="showTeachers(${index})">
                        <img src="${subject.image}" class="card-img" onerror="this.src='https://placehold.co/600x400?text=Image+Error'" alt="${subject.name}">
                        <div class="card-body">
                            <div class="card-title">${subject.name}</div>
                            <div class="card-desc">اضغط لعرض المدرسين</div>
                        </div>
                    </div>
                `;
            });
        }

        function showTeachers(subjectIndex) {
            currentLevel = 'teachers';
            currentSubjectIndex = subjectIndex;
            const subject = platformData[subjectIndex];
            
            sectionTitle.innerText = `مدرسين مادة ${subject.name}`;
            backBtn.style.display = 'inline-block';
            contentArea.innerHTML = '';

            if(subject.teachers.length === 0) {
                contentArea.innerHTML = '<p>لا يوجد مدرسين حالياً.</p>';
                return;
            }

            subject.teachers.forEach((teacher, tIndex) => {
                contentArea.innerHTML += `
                    <div class="card" onclick="showCourses(${subjectIndex}, ${tIndex})">
                        <img src="${teacher.image}" class="card-img" onerror="this.src='https://placehold.co/600x400?text=Image+Error'" alt="${teacher.name}">
                        <div class="card-body">
                            <div class="card-title">${teacher.name}</div>
                            <div class="card-desc">اضغط لعرض الكورسات</div>
                        </div>
                    </div>
                `;
            });
        }

        function showCourses(subjectIndex, teacherIndex) {
            currentLevel = 'courses';
            const teacher = platformData[subjectIndex].teachers[teacherIndex];
            sectionTitle.innerText = `كورسات: ${teacher.name}`;
            contentArea.innerHTML = '';

            if(teacher.courses.length === 0) {
                contentArea.innerHTML = '<p>لا يوجد فيديوهات حالياً.</p>';
                return;
            }

            teacher.courses.forEach(course => {
                // هنا بنستخدم كود Plyr المخصص عشان يخفي شكل اليوتيوب
                contentArea.innerHTML += `
                    <div class="card video-card">
                        <div class="plyr__video-embed" id="player-${course.id}">
                            <iframe
                                src="https://www.youtube.com/embed/${course.video_id}?origin=https://plyr.io&amp;iv_load_policy=3&amp;modestbranding=1&amp;playsinline=1&amp;showinfo=0&amp;rel=0&amp;enablejsapi=1"
                                allowfullscreen
                                allowtransparency
                                allow="autoplay"
                            ></iframe>
                        </div>
                        <div class="card-body">
                            <div class="card-title">${course.title}</div>
                            <div class="card-desc">${course.description}</div>
                        </div>
                    </div>
                `;
            });

            // تفعيل المشغل الاحترافي لكل الفيديوهات
            const players = Plyr.setup('.plyr__video-embed', {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                hideControls: true,
            });
        }

        function goBack() {
            if (currentLevel === 'courses') {
                showTeachers(currentSubjectIndex);
            } else if (currentLevel === 'teachers') {
                showSubjects();
            }
        }

        showSubjects();

    </script>
</body>
</html>
