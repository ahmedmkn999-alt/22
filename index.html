<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Mark Two | Player Hub</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- الثيم الأزرق النيون --- */
        :root {
            --main-color: #00e1ff;
            --bg-color: #02050a;
            --card-bg: #0a0f18;
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }

        body {
            background: linear-gradient(135deg, #02050a 0%, #050a14 100%);
            color: var(--text-color);
            margin: 0; min-height: 100vh; overflow-x: hidden;
        }

        /* --- شاشة الدخول --- */
        #loginSection {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a2332 0%, #000000 100%);
            position: fixed; top: 0; left: 0; width: 100%; z-index: 9999;
        }
        .login-card {
            background: rgba(10, 15, 24, 0.95); border: 2px solid var(--main-color); padding: 40px; 
            border-radius: 20px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 225, 255, 0.2); backdrop-filter: blur(10px);
        }
        .login-logo { font-size: 2.5rem; font-weight: 900; color: var(--main-color); margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 15px var(--main-color); }
        .login-input {
            width: 100%; padding: 15px; background: #000; border: 1px solid #333; 
            border-radius: 50px; color: #fff; text-align: center; font-size: 1.2rem; margin-bottom: 20px;
        }
        .login-input:focus { border-color: var(--main-color); box-shadow: 0 0 10px rgba(0, 225, 255, 0.3); }
        .login-btn {
            width: 100%; padding: 15px; background: var(--main-color); color: #000; border: none; 
            border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .login-btn:hover { background: #fff; box-shadow: 0 0 20px var(--main-color); }
        .error-msg { color: #ff3333; margin-top: 15px; font-weight: bold; display: none; }

        /* --- شاشة الترحيب --- */
        #welcomeSection {
            display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center;
            background: #000; position: fixed; top: 0; left: 0; width: 100%; z-index: 9000;
        }
        .counter-circle {
            width: 120px; height: 120px; border: 5px solid var(--main-color); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; font-weight: bold; color: #fff; text-shadow: 0 0 20px var(--main-color);
            box-shadow: 0 0 30px rgba(0, 225, 255, 0.3); animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }
        .welcome-text { margin-top: 20px; color: #888; font-size: 1.1rem; }

        /* --- المنصة --- */
        #platformSection { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

        header {
            text-align: center; margin-bottom: 30px; padding-bottom: 20px;
            border-bottom: 2px solid var(--main-color); position: relative;
            display: flex; justify-content: space-between; align-items: center;
        }

        h1 { margin: 0; color: var(--main-color); font-size: 1.8rem; text-shadow: 0 0 15px var(--main-color); font-weight: 900; }
        
        .header-icons { display: flex; gap: 10px; }
        .icon-btn { 
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--main-color); 
            display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; transition: 0.3s;
        }
        .icon-btn:hover { background: var(--main-color); color: #000; }
        .logout-btn { border-color: #ff3333; color: #ff3333; }
        .logout-btn:hover { background: #ff3333; color: #fff; }

        #backBtn {
            display: none; background-color: transparent; color: var(--main-color);
            border: 2px solid var(--main-color); padding: 8px 25px; border-radius: 50px;
            cursor: pointer; font-weight: bold; margin-bottom: 20px; transition: 0.3s;
        }
        #backBtn:hover { background-color: var(--main-color); color: #000; }

        h2#sectionTitle { color: #fff; border-right: 4px solid var(--main-color); padding-right: 10px; margin-bottom: 20px; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; padding-bottom: 50px; }

        .card {
            background-color: var(--card-bg); border-radius: 16px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer; border: 1px solid rgba(0, 225, 255, 0.15);
        }
        .card:active { transform: scale(0.97); border-color: var(--main-color); }
        
        .card-img-container { width: 100%; height: 160px; background: #000; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .card-img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .card-body { padding: 15px; text-align: center; }
        .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .card-desc { font-size: 0.9rem; color: #888; }

        /* الفيديو */
        .video-wrapper {
            max-width: 800px; margin: 0 auto 40px auto; background: #000;
            border-radius: 16px; overflow: hidden; border: 1px solid #333;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); position: relative;
        }
        .video-info { padding: 20px; background: #111; border-bottom: 1px solid #333; }
        .video-title { font-size: 1.2rem; font-weight: bold; color: var(--main-color); }
        .watermark {
            position: absolute; top: 10px; left: 10px; color: rgba(255,255,255,0.2); 
            font-size: 1.5rem; font-weight: bold; z-index: 100; pointer-events: none;
            animation: float 5s infinite alternate;
        }
        @keyframes float { 0% {top:10%;left:10%} 100% {top:80%;left:80%} }

        /* مودال */
        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .modal-content { background: #0f121a; border: 1px solid var(--main-color); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; position: relative; }
        .close { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 22px; cursor: pointer; }
        
        .wa-btn {
            display: block; background: #25D366; color: #fff; padding: 10px; margin-top: 15px; 
            border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 1.1rem;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loginSection">
        <div class="login-card">
            <div class="login-logo">Full Mark Two</div>
            <p style="color:#888; margin-bottom:20px;">أدخل كود الطالب</p>
            <form onsubmit="event.preventDefault(); checkCode();">
                <input type="text" id="codeParams" class="login-input" placeholder="الكود هنا" autocomplete="off">
                <button type="submit" class="login-btn">دخول</button>
            </form>
            <div id="loginMsg" class="error-msg"></div>
            <p style="color:#555; font-size:0.8rem; margin-top:10px;">كود التجربة: 123456</p>
        </div>
    </div>

    <div id="welcomeSection">
        <div class="counter-circle" id="counter">5</div>
        <div class="welcome-text">جاري تجهيز محتواك التعليمي...</div>
        <button onclick="cancelLogin()" style="margin-top:20px; background:none; border:1px solid #555; color:#777; padding:5px 15px; border-radius:20px; cursor:pointer;">تغيير الحساب</button>
    </div>

    <div id="platformSection">
        <header>
            <h1>🎓 Full Mark Two</h1>
            <div class="header-icons">
                <div class="icon-btn" onclick="openSupport()"><i class="fas fa-headset"></i></div>
                <div class="icon-btn" onclick="openProfile()"><i class="fas fa-user"></i></div>
                <div class="icon-btn logout-btn" onclick="logout()"><i class="fas fa-power-off"></i></div>
            </div>
        </header>

        <div style="max-width: 1200px; margin: 0 auto;">
            <button id="backBtn" onclick="goBack()">🔙 رجوع</button>
            <h2 id="sectionTitle">اختر المادة</h2>
            <div id="contentArea" class="grid-container"></div>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('profileModal')">&times;</span>
            <h3 style="color:var(--main-color)">الملف الشخصي</h3>
            <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" style="width:80px; margin:10px 0;">
            <div id="pName" style="font-size:1.5rem; font-weight:bold; margin:10px 0;">...</div>
            <div id="pCode" style="color:#888; font-family:monospace; background:#000; padding:5px; border-radius:5px;">...</div>
        </div>
    </div>

    <div id="supportModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('supportModal')">&times;</span>
            <h3>الدعم الفني</h3>
            <p style="color:#aaa;">واجهتك مشكلة؟ تواصل معنا فوراً</p>
            <a href="https://wa.me/+201000000000" target="_blank" class="wa-btn">
                <i class="fab fa-whatsapp"></i> تواصل عبر واتساب
            </a>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        // ==========================================
        // 🔐 (قائمة الطلاب) ضيف الأكواد والأسماء هنا
        // ==========================================
        const ALLOWED_CODES = {
            "123456": "زائر تجريبي",
            "100200": "أحمد محمد",
            "556677": "مريم علي",
            "202620": "طالب ثانوية عامة"
        };

        // --- نظام الدخول ---
        let countTimer;

        window.onload = function() {
            document.body.style.overflow = "auto"; // تأمين
            
            const savedUser = localStorage.getItem('fullmark_user');
            if(savedUser && ALLOWED_CODES[savedUser]) {
                startCountdown();
            } else {
                document.getElementById('loginSection').style.display = 'flex';
            }
        };

        function checkCode() {
            const code = document.getElementById('codeParams').value.trim();
            const msg = document.getElementById('loginMsg');
            const btn = document.querySelector('.login-btn');

            if(!code) { msg.innerText = "اكتب الكود!"; msg.style.display = 'block'; return; }
            
            btn.innerText = "جاري التحقق...";

            // التحقق السريع من القائمة
            setTimeout(() => {
                if(ALLOWED_CODES[code]) {
                    localStorage.setItem('fullmark_user', code);
                    startCountdown();
                } else {
                    msg.innerText = "❌ الكود غير صحيح!";
                    msg.style.display = 'block';
                    btn.innerText = "دخول";
                }
            }, 500);
        }

        function startCountdown() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('welcomeSection').style.display = 'flex';
            
            let count = 5;
            const el = document.getElementById('counter');
            el.innerText = count;

            countTimer = setInterval(() => {
                count--;
                el.innerText = count;
                if(count <= 0) {
                    clearInterval(countTimer);
                    document.getElementById('welcomeSection').style.display = 'none';
                    document.getElementById('platformSection').style.display = 'block';
                    showSubjects(); 
                }
            }, 1000);
        }

        function cancelLogin() {
            clearInterval(countTimer);
            localStorage.removeItem('fullmark_user');
            location.reload();
        }

        function logout() {
            localStorage.removeItem('fullmark_user');
            location.reload();
        }

        // ==========================================
        // 📚 داتا المواد والمدرسين
        // ==========================================
        
        let platformData = [
          {
            name: "الفرنساوي",
            image: "https://i.postimg.cc/NjRcy2s0/a75e136b-7909-485f-95e8-862fddd2c0bc.png", 
            teachers: [
              {
                name: "مسيو انس السعيد",
                image: "https://i.postimg.cc/sDdy3JyV/lhctmi-Qt-ANEg0PDcec-CE1QTCqr-Kza-Eq-GZ6s-Zt-MJ4.jpg",
                folders: [
                  {
                    title: "كورس شرح المنهج 2026",
                    image: "https://cdn-icons-png.flaticon.com/512/3767/3767084.png",
                    videos: [
                        { title: "جزء واحد تالتة ثانوي", desc: "بداية المنهج والقواعد الأساسية.", vid: "3PC1fxpp-Xk" },
                        { title: "جزء اتنين تالتة ثانوي", desc: "استكمال الشرح والتدريبات.", vid: "fVJTHj5YW7Y" }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: "الإيطالي",
            image: "https://i.postimg.cc/VkX8S0fb/Hotels-near-the-Colosseum.jpg",
            teachers: [
              {
                name: "سنيور مدحت غانم",
                image: "https://i.postimg.cc/0NQ1VWGy/hqdefault.jpg",
                folders: [
                   {
                    title: "مراجعات ليلة الامتحان",
                    image: "https://cdn-icons-png.flaticon.com/512/2921/2921226.png",
                    videos: [
                        { title: "الإنقاذ: منهج الإيطالي كاملاً", desc: "المنهج كله في 5 ساعات بس.", vid: "T6hpZH5AMnk" }
                    ]
                   }
                ]
              }
            ]
          },
          // ضيف باقي المواد هنا بنفس الطريقة
        ];

        // ==========================================
        // 🎮 منطق العرض
        // ==========================================

        const contentArea = document.getElementById('contentArea');
        const sectionTitle = document.getElementById('sectionTitle');
        const backBtn = document.getElementById('backBtn');
        
        let state = { level: 'subjects', subjectIdx: null, teacherIdx: null, folderIdx: null };

        function showSubjects() {
            state.level = 'subjects';
            sectionTitle.innerText = "اختر المادة";
            backBtn.style.display = 'none';
            contentArea.className = "grid-container";
            contentArea.innerHTML = '';

            platformData.forEach((subject, index) => {
                contentArea.innerHTML += `
                    <div class="card" onclick="showTeachers(${index})">
                        <div class="card-img-container"><img src="${subject.image}" class="card-img"></div>
                        <div class="card-body">
                            <div class="card-title">${subject.name}</div>
                            <div class="card-desc">اضغط لعرض المدرسين</div>
                        </div>
                    </div>
                `;
            });
        }

        function showTeachers(idx) {
            state.level = 'teachers';
            state.subjectIdx = idx;
            const subject = platformData[idx];
            sectionTitle.innerText = `مدرسين مادة ${subject.name}`;
            backBtn.style.display = 'inline-block';
            contentArea.className = "grid-container";
            contentArea.innerHTML = '';

            subject.teachers.forEach((teacher, tIndex) => {
                contentArea.innerHTML += `
                    <div class="card" onclick="showFolders(${tIndex})">
                        <div class="card-img-container"><img src="${teacher.image}" class="card-img"></div>
                        <div class="card-body">
                            <div class="card-title">${teacher.name}</div>
                            <div class="card-desc">اضغط لعرض الكورسات</div>
                        </div>
                    </div>
                `;
            });
        }

        function showFolders(tIndex) {
            state.level = 'folders';
            state.teacherIdx = tIndex;
            const teacher = platformData[state.subjectIdx].teachers[tIndex];
            sectionTitle.innerText = `كورسات: ${teacher.name}`;
            contentArea.className = "grid-container";
            contentArea.innerHTML = '';

            if(!teacher.folders || teacher.folders.length === 0) {
                 contentArea.innerHTML = '<p style="text-align:center;width:100%;color:#888;">لا يوجد محتوى حالياً</p>'; return;
            }

            teacher.folders.forEach((folder, fIndex) => {
                contentArea.innerHTML += `
                    <div class="card folder-card" onclick="showVideos(${fIndex})">
                        <div class="card-img-container"><img src="${folder.image}" class="card-img"></div>
                        <div class="card-body">
                            <div class="card-title">${folder.title}</div>
                            <div class="card-desc">${folder.videos.length} فيديوهات</div>
                        </div>
                    </div>
                `;
            });
        }

        function showVideos(fIndex) {
            state.level = 'videos';
            state.folderIdx = fIndex;
            const folder = platformData[state.subjectIdx].teachers[state.teacherIdx].folders[fIndex];
            sectionTitle.innerText = folder.title;
            contentArea.className = ""; 
            contentArea.innerHTML = '';
            
            const userCode = localStorage.getItem('fullmark_user');

            folder.videos.forEach((video, vIndex) => {
                contentArea.innerHTML += `
                    <div class="video-wrapper">
                        <div class="plyr__video-embed" id="player-${vIndex}">
                            <iframe
                                src="https://www.youtube.com/embed/${video.vid}?origin=https://plyr.io&amp;iv_load_policy=3&amp;modestbranding=1&amp;playsinline=1&amp;showinfo=0&amp;rel=0&amp;enablejsapi=1"
                                allowfullscreen allowtransparency allow="autoplay"
                            ></iframe>
                            <div class="watermark">${userCode}</div>
                        </div>
                        <div class="video-info">
                            <div class="video-title">🎥 ${video.title}</div>
                            <div style="color:#666;">${video.desc}</div>
                        </div>
                    </div>
                `;
            });

            Plyr.setup('.plyr__video-embed', {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscr
