<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Mark Two | Premium</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* نظام الألوان الأزرق الغامق (Dark Mode) */
            --bg-color: #0f172a;       /* خلفية الصفحة كحلي غامق */
            --header-bg: #1e293b;      /* خلفية الهيدر */
            --card-bg: #1e293b;        /* خلفية الكروت */
            --accent-color: #38bdf8;   /* لون لبني مضيء */
            --text-main: #f1f5f9;      /* نص أبيض */
            --text-sec: #94a3b8;       /* نص رمادي */
            --glow: 0 0 20px rgba(56, 189, 248, 0.15); /* توهج خفيف */
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ==============================
           1. شاشة الدخول (المطورة)
           ============================== */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .login-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        .login-title { font-size: 2rem; font-weight: 900; color: var(--accent-color); margin-bottom: 10px; }
        .login-desc { color: var(--text-sec); margin-bottom: 30px; font-size: 0.9rem; }

        .input-field {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            font-family: 'Cairo';
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }
        
        .input-field:focus { border-color: var(--accent-color); box-shadow: var(--glow); }

        .btn-main {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: 'Cairo';
            transition: 0.3s;
        }

        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }
        .btn-main:disabled { opacity: 0.5; cursor: wait; }

        /* ==============================
           2. المنصة من الداخل
           ============================== */
        #mainPlatform { display: none; padding: 20px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid #334155;
        }

        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent-color); }
        .logout-btn { background: #dc2626; color: white; padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-family: 'Cairo'; }

        /* أزرار التنقل */
        #navBar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        .back-btn { background: #334155; color: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; display: none; transition: 0.3s; }
        .back-btn:hover { background: var(--accent-color); }
        
        #pageTitle { font-size: 1.4rem; font-weight: bold; color: white; }

        /* الشبكة (Grid) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        /* الكروت */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            filter: brightness(0.8);
            transition: 0.3s;
        }

        .card:hover .card-img { filter: brightness(1); }

        .card-body { padding: 20px; text-align: center; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .card-sub { font-size: 0.9rem; color: var(--text-sec); }

        /* كروت المجلدات */
        .folder-icon {
            font-size: 4rem; margin-bottom: 10px; display: block;
        }

        /* مشغل الفيديو */
        .video-container { max-width: 900px; margin: 0 auto; }
        .video-item {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid #334155;
        }
        .video-meta { padding: 20px; }
        .plyr--video { --plyr-color-main: #38bdf8; }

    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <div class="login-title">Full Mark Two</div>
            <div class="login-desc">منصة تعليمية متطورة للمرحلة الثانوية</div>
            
            <input type="password" id="codeIn" class="input-field" placeholder="أدخل كود الطالب" onkeypress="if(event.key==='Enter') tryLogin()">
            <button id="loginBtn" class="btn-main" onclick="tryLogin()">تسجيل الدخول</button>
            <p id="msg" style="color: #f87171; margin-top: 15px; display: none;"></p>
        </div>
    </div>

    <div id="mainPlatform">
        <header>
            <div class="logo">💎 Full Mark 2</div>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </header>

        <div id="navBar">
            <button id="backBtn" class="back-btn" onclick="goBack()">🔙 رجوع</button>
            <div id="pageTitle">المواد الدراسية</div>
        </div>

        <div id="content" class="grid-container"></div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

        // إعدادات الفايربيز بتاعتك
        const firebaseConfig = {
            apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds",
            authDomain: "full-mark-8d434.firebaseapp.com",
            projectId: "full-mark-8d434",
            storageBucket: "full-mark-8d434.firebasestorage.app",
            messagingSenderId: "802579483999",
            appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea",
            measurementId: "G-26F9W89TB8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ===================================
        // 1. نظام الدخول والحفظ التلقائي
        // ===================================
        
        window.tryLogin = async (manualCode = null) => {
            const inputField = document.getElementById('codeIn');
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('msg');
            
            // لو مفيش كود مبعوت للدالة، هنجيبه من الحقل
            const code = manualCode || inputField.value.trim();

            if (!code) return;

            if (!manualCode) { // لو دخول يدوي، شغل تأثير التحميل
                btn.innerText = "جاري التحقق...";
                btn.disabled = true;
                msg.style.display = 'none';
            }

            try {
                // البحث في قاعدة البيانات
                const q = query(collection(db, "codes"), where("code", "==", code));
                const snapshot = await getDocs(q);

                if (!snapshot.empty) {
                    // دخول ناجح
                    localStorage.setItem('fm_student_code', code); // حفظ الكود في المتصفح
                    showPlatform();
                } else {
                    // كود غلط
                    if (!manualCode) {
                        msg.innerText = "الكود غير صحيح أو منتهي!";
                        msg.style.display = 'block';
                    }
                }
            } catch (e) {
                console.error(e);
                if (!manualCode) {
                    msg.innerText = "خطأ في الاتصال بالانترنت";
                    msg.style.display = 'block';
                }
            } finally {
                if (!manualCode) {
                    btn.innerText = "تسجيل الدخول";
                    btn.disabled = false;
                }
            }
        };

        // دالة إظهار المنصة
        function showPlatform() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainPlatform').style.display = 'block';
        }

        // دالة الخروج
        window.logout = () => {
            if(confirm("هل تريد تسجيل الخروج؟ سيطلب الكود مرة أخرى.")) {
                localStorage.removeItem('fm_student_code');
                location.reload();
            }
        };

        // عند فتح الصفحة: فحص هل فيه كود محفوظ؟
        window.addEventListener('load', () => {
            const savedCode = localStorage.getItem('fm_student_code');
            if (savedCode) {
                // لو فيه كود، حاول تدخل بيه في الخلفية
                window.tryLogin(savedCode);
            }
        });

    </script>

    <script>
        // ===================================
        // 2. داتا المواد (كاملة)
        // ===================================
        const data = [
          {
            id: 1, name: "الفرنساوي", 
            img: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&q=80&w=1000",
            teachers: [
              {
                id: 101, name: "مسيو انس السعيد", 
                img: "https://cdn-icons-png.flaticon.com/512/1995/1995574.png", // صورة رمزية للمدرس
                folders: [
                  {
                    title: "شرح المنهج 2026",
                    videos: [
                        { title: "المحاضرة الأولى: التأسيس", desc: "شرح أساسيات النطق والقواعد.", vid: "3PC1fxpp-Xk" },
                        { title: "المحاضرة الثانية: الوحدة الأولى", desc: "كلمات ومواقف الدرس الأول.", vid: "fVJTHj5YW7Y" }
                    ]
                  }
                ]
              }
            ]
          },
          {
            id: 2, name: "الإيطالي", 
            img: "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?auto=format&fit=crop&q=80&w=1000",
            teachers: [
              {
                id: 201, name: "سنيور مدحت غانم", 
                img: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png",
                folders: [
                   {
                    title: "مراجعات نهائية",
                    videos: [
                        { title: "المنهج كاملاً في 5 ساعات", desc: "أقوى مراجعة لليلة الامتحان.", vid: "T6hpZH5AMnk" }
                    ]
                   }
                ]
              }
            ]
          },
          {
            id: 3, name: "الألماني", 
            img: "https://images.unsplash.com/photo-1599946347371-68eb71b16afc?auto=format&fit=crop&q=80&w=1000",
            teachers: [
              {
                id: 301, name: "هير ياسين ابو الزيد", 
                img: "https://cdn-icons-png.flaticon.com/512/1995/1995574.png",
                folders: [
                    {
                        title: "كورس التأسيس",
                        videos: [
                            { title: "الحروف والنطق", desc: "بداية اللغة الألمانية.", vid: "JOLc4Jc9yFU" },
                            { title: "الجراماتيك", desc: "قواعد الجملة.", vid: "L2irLAg7jHM" }
                        ]
                    }
                ]
              }
            ]
          },
          {
            id: 4, name: "الإسباني", 
            img: "https://images.unsplash.com/photo-1543783207-ec64e4d95325?auto=format&fit=crop&q=80&w=1000",
            teachers: [
              {
                id: 401, name: "سنيور ماجد فارس", 
                img: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png",
                folders: [
                    {
                        title: "الخلاصة",
                        videos: [
                             { title: "شرح المنهج كاملاً", desc: "فيديو واحد لامم الدنيا.", vid: "K9ZOydc1cqs" }
                        ]
                    }
                ]
              }
            ]
          }
        ];

        // ===================================
        // 3. التحكم في العرض
        // ===================================
        const content = document.getElementById('content');
        const title = document.getElementById('pageTitle');
        const backBtn = document.getElementById('backBtn');
        
        let path = { level: 'home', subIdx: null, teachIdx: null };

        // 1. المواد
        function renderSubjects() {
            path.level = 'home';
            title.innerText = "اختر المادة الدراسية";
            backBtn.style.display = 'none';
            content.className = "grid-container";
            content.innerHTML = data.map((sub, i) => `
                <div class="card" onclick="renderTeachers(${i})">
                    <img src="${sub.img}" class="card-img" alt="${sub.name}">
                    <div class="card-body">
                        <div class="card-title">${sub.name}</div>
                        <div class="card-sub">اضغط للدخول</div>
                    </div>
                </div>
            `).join('');
        }

        // 2. المدرسين
        window.renderTeachers = (i) => {
            path.level = 'teachers';
            path.subIdx = i;
            const sub = data[i];
            
            title.innerText = `مدرسين مادة: ${sub.name}`;
            backBtn.style.display = 'block';
            content.className = "grid-container";
            
            if(!sub.teachers.length) {
                content.innerHTML = '<p style="text-align:center; width:100%;">لا يوجد مدرسين حالياً</p>'; return;
            }

            content.innerHTML = sub.teachers.map((t, ti) => `
                <div class="card" onclick="renderFolders(${ti})">
                    <div style="padding:20px; text-align:center;">
                        <img src="${t.img}" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:2px solid #38bdf8;">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${t.name}</div>
                        <div class="card-sub">عرض الكورسات</div>
                    </div>
                </div>
            `).join('');
        }

        // 3. المجلدات
        window.renderFolders = (ti) => {
            path.level = 'folders';
            path.teachIdx = ti;
            const teacher = data[path.subIdx].teachers[ti];
            
            title.innerText = `كورسات: ${teacher.name}`;
            content.innerHTML = teacher.folders.map((f, fi) => `
                <div class="card" onclick="renderVideos(${fi})">
                     <div style="padding:30px; text-align:center; background:#0f172a;">
                        <span style="font-size:4rem;">📁</span>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${f.title}</div>
                        <div class="card-sub">${f.videos.length} فيديو</div>
                    </div>
                </div>
            `).join('');
        }

        // 4. الفيديوهات
        window.renderVideos = (fi) => {
            path.level = 'videos';
            const folder = data[path.subIdx].teachers[path.teachIdx].folders[fi];
            
            title.innerText = folder.title;
            content.className = "video-container";
            
            content.innerHTML = folder.videos.map((v, vi) => `
                <div class="video-item">
                    <div class="plyr__video-embed" id="player-${vi}">
                        <iframe src="https://www.youtube.com/embed/${v.vid}?origin=https://plyr.io&iv_load_policy=3&modestbranding=1&playsinline=1&showinfo=0&rel=0&enablejsapi=1" allowfullscreen allowtransparency allow="autoplay"></iframe>
                    </div>
                    <div class="video-meta">
                        <div class="card-title">🎥 ${v.title}</div>
                        <div style="color:#94a3b8; font-size:0.9rem;">${v.desc}</div>
                    </div>
                </div>
            `).join('');

            Plyr.setup('.plyr__video-embed', { controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'] });
        }

        window.goBack = () => {
            if(path.level === 'videos') renderFolders(path.teachIdx);
            else if(path.level === 'folders') renderTeachers(path.subIdx);
            else if(path.level === 'teachers') renderSubjects();
        }

        // التشغيل المبدئي
        renderSubjects();

    </script>
</body>
</html>
