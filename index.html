<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذاكرلي | Player Hub</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- نفس الثيم الأزرق النيون --- */
        :root {
            --main-color: #00e1ff; /* النيون الأزرق */
            --bg-color: #02050a;   /* الخلفية السوداء */
            --card-bg: #0a0f18;    /* لون الكروت الغامق */
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background: linear-gradient(135deg, #02050a 0%, #050a14 100%);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- شاشة الدخول --- */
        #loginSection {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a2332 0%, #000000 100%);
            position: fixed; top: 0; left: 0; width: 100%; z-index: 9999;
        }
        .login-card {
            background: rgba(10, 15, 24, 0.9); border: 2px solid var(--main-color); padding: 40px; 
            border-radius: 20px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 225, 255, 0.2); backdrop-filter: blur(10px);
        }
        .login-logo { font-size: 2.5rem; font-weight: 900; color: var(--main-color); margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 15px var(--main-color); }
        .login-input {
            width: 100%; padding: 15px; background: #000; border: 1px solid #333; 
            border-radius: 50px; color: #fff; text-align: center; font-size: 1.2rem; outline: none; margin-bottom: 20px;
        }
        .login-btn {
            width: 100%; padding: 15px; background: var(--main-color); color: #000; border: none; 
            border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: #ff3333; margin-top: 15px; display: none; }

        /* --- المنصة --- */
        #platformSection { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--main-color);
            position: relative;
        }

        h1 { margin: 0; color: var(--main-color); font-size: 2rem; text-shadow: 0 0 15px var(--main-color); font-weight: 900; }
        
        /* زرار الخروج */
        .logout-btn {
            position: absolute; top: 0; left: 0;
            background: transparent; color: #ff3333; border: 1px solid #ff3333;
            padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 0.9rem;
        }

        #backBtn {
            display: none;
            background: transparent;
            color: var(--main-color);
            border: 2px solid var(--main-color);
            padding: 8px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        #backBtn:hover { background-color: var(--main-color); color: #000; }

        h2#sectionTitle { color: #fff; border-right: 4px solid var(--main-color); padding-right: 10px; margin-bottom: 20px; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 225, 255, 0.15);
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .card:active { transform: scale(0.97); border-color: var(--main-color); }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        /* تنسيق خاص لكروت المجلدات/الكورسات */
        .folder-card .card-img {
            height: 140px; 
            object-fit: contain;
            padding: 20px;
            background: #000; /* خلفية سوداء للصور الشفافة */
        }

        .card-body { padding: 15px; text-align: center; }
        .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .card-desc { font-size: 0.9rem; color: #888; }

        /* تنسيق الفيديو */
        .video-wrapper {
            max-width: 800px;
            margin: 0 auto 40px auto;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #333;
        }
        
        .video-info { padding: 15px; background: #111; }
        .video-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: var(--main-color); }
        .video-desc { color: #aaa; font-size: 0.9rem; }
        
        /* تحسين شكل Plyr */
        .plyr--video {
            --plyr-color-main: #00e1ff;
        }
    </style>
</head>
<body>

    <div id="loginSection">
        <div class="login-card">
            <div class="login-logo">ذاكرلي</div>
            <p style="color:#888; margin-bottom:20px;">أدخل كود الطالب للدخول</p>
            <input type="text" id="codeParams" class="login-input" placeholder="الكود هنا" autocomplete="off">
            <button class="login-btn" onclick="attemptLogin()">تسجيل الدخول</button>
            <div id="loginMsg" class="error-msg"></div>
        </div>
    </div>

    <div id="platformSection">
        <header>
            <h1>🎓 ذاكرلي</h1> <button class="logout-btn" onclick="logout()">خروج</button>
        </header>

        <div style="max-width: 1200px; margin: 0 auto;">
            <button id="backBtn" onclick="goBack()">🔙 رجوع</button>
            <h2 id="sectionTitle">اختر المادة</h2>
            <div id="contentArea" class="grid-container"></div>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // --- 1. إعدادات الفايربيز (نفس القديمة) ---
        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        // --- 2. نظام الدخول ---
        // التحقق عند الفتح
        if(localStorage.getItem('fullmark_user')) {
            showPlatform();
        }

        function attemptLogin() {
            const code = document.getElementById('codeParams').value.trim();
            const msg = document.getElementById('loginMsg');
            const btn = document.querySelector('.login-btn');

            if(!code) { msg.innerText = "اكتب الكود!"; msg.style.display = "block"; return; }
            btn.innerText = "جاري التحقق...";

            db.collection('codes').where('code', '==', code).get().then(snap => {
                if(snap.empty) {
                    msg.innerText = "الكود غير صحيح";
                    msg.style.display = "block";
                    btn.innerText = "تسجيل الدخول";
                } else {
                    localStorage.setItem('fullmark_user', code);
                    showPlatform();
                }
            }).catch(e => {
                msg.innerText = "تأكد من الإنترنت";
                msg.style.display = "block";
                btn.innerText = "تسجيل الدخول";
            });
        }

        function showPlatform() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('platformSection').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('fullmark_user');
            location.reload();
        }

        // ==========================================
        // 3. الداتا الخاصة بك (زي ما هي)
        // ==========================================
        
        const platformData = [
          {
            "id": 1,
            "name": "الفرنساوي",
            "image": "https://i.postimg.cc/NjRcy2s0/a75e136b-7909-485f-95e8-862fddd2c0bc.png", 
            "teachers": [
              {
                "id": 101,
                "name": "مسيو انس السعيد",
                "image": "https://i.postimg.cc/sDdy3JyV/lhctmi-Qt-ANEg0PDcec-CE1QTCqr-Kza-Eq-GZ6s-Zt-MJ4.jpg",
                "folders": [ 
                  {
                    "id": "f1",
                    "title": "كورس شرح المنهج 2026",
                    "image": "https://cdn-icons-png.flaticon.com/512/3767/3767084.png", 
                    "videos": [
                        { "title": "جزء واحد تالتة ثانوي", "desc": "بداية المنهج والقواعد الأساسية.", "vid": "3PC1fxpp-Xk" },
                        { "title": "جزء اتنين تالتة ثانوي", "desc": "استكمال الشرح والتدريبات.", "vid": "fVJTHj5YW7Y" },
                        { "title": "جزء تلاتة تالتة ثانوي", "desc": "شرح متقدم وملاحظات هامة.", "vid": "Afx9AHypc7M" },
                        { "title": "الجزء الاخير تالتة ثانوي", "desc": "ختام المنهج والمراجعة.", "vid": "6s_TWiP1KgQ" }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "id": 2,
            "name": "الإيطالي",
            "image": "https://i.postimg.cc/VkX8S0fb/Hotels-near-the-Colosseum.jpg",
            "teachers": [
              {
                "id": 201,
                "name": "سنيور مدحت غانم",
                "image": "https://i.postimg.cc/0NQ1VWGy/hqdefault.jpg",
                "folders": [
                   {
                    "id": "f2",
                    "title": "مراجعات ليلة الامتحان",
                    "image": "https://cdn-icons-png.flaticon.com/512/2921/2921226.png",
                    "videos": [
                        { "title": "الإنقاذ: منهج الإيطالي كاملاً", "desc": "المنهج كله في 5 ساعات بس.", "vid": "T6hpZH5AMnk" }
                    ]
                   }
                ]
              }
            ]
          },
          {
            "id": 3,
            "name": "الألماني",
            "image": "https://i.postimg.cc/bw1hGSyS/52023310-702.jpg",
            "teachers": [
              {
                "id": 301,
                "name": "هير ياسين ابو الزيد",
                "image": "https://i.postimg.cc/MHkkKzCd/hqdefault-(1).jpg",
                "folders": [
                    {
                        "id": "f3",
                        "title": "كورس التأسيس والشرح",
                        "image": "https://cdn-icons-png.flaticon.com/512/3767/3767084.png",
                        "videos": [
                            { "title": "اللغة الألمانية - ج1", "desc": "الأساسيات وقواعد النطق.", "vid": "JOLc4Jc9yFU" },
                            { "title": "اللغة الألمانية - ج2", "desc": "الجراماتيك وتريكات الامتحانات.", "vid": "L2irLAg7jHM" },
                            { "title": "اللغة الألمانية - ج3", "desc": "المواقف الحياتية.", "vid": "I-3VLcEoCP8" },
                            { "title": "اللغة الألمانية - ج4", "desc": "حل تدريبات شاملة.", "vid": "oRopKQ63a-I" }
                        ]
                    }
                ]
              }
            ]
          },
          {
            "id": 4,
            "name": "الإسباني",
            "image": "https://i.postimg.cc/L8jpqg95/250px-Flag-of-Spain-svg.png",
            "teachers": [
              {
                "id": 401,
                "name": "سنيور ماجد فارس",
                "image": "https://i.postimg.cc/jdbVpdQ5/FB-IMG-1770239115997.jpg",
                "folders": [
                    {
                        "id": "f4",
                        "title": "المراجعة النهائية",
                        "image": "https://cdn-icons-png.flaticon.com/512/2921/2921226.png",
                        "videos": [
                             { "title": "شرح المنهج كاملاً", "desc": "فيديو واحد فيه الخلاصة.", "vid": "K9ZOydc1cqs" }
                        ]
                    }
                ]
              }
            ]
          }
        ];

        // ==========================================
        // 4. منطق العرض
        // ==========================================

        const contentArea = document.getElementById('contentArea');
        const sectionTitle = document.getElementById('sectionTitle');
        const backBtn = document.getElementById('backBtn');
        
        let state = {
            level: 'subjects', 
            subjectIdx: null,
            teacherIdx: null,
            folderIdx: null
        };

        // 1. عرض المواد
        function showSubjects() {
            state.level = 'subjects';
            sectionTitle.innerText = "اختر المادة";
            backBtn.style.display = 'none';
            contentArea.className = "grid-container"; 
            contentArea.innerHTML = '';

            platformData.forEach((subject, index) => {
                contentArea.innerHTML += `
                    <div class="card" onclick="showTeachers(${index})">
                        <img src="${subject.image}" class="card-img" alt="${subject.name}">
                        <div class="card-body">
                            <div class="card-title">${subject.name}</div>
                            <div class="card-desc">اضغط لعرض المدرسين</div>
                        </div>
                    </div>
                `;
            });
        }

        // 2. عرض المدرسين
        function showTeachers(idx) {
            state.level = 'teachers';
            state.subjectIdx = idx;
            const subject = platformData[idx];
            
            sectionTitle.innerText = `مدرسين مادة ${subject.name}`;
            backBtn.style.display = 'inline-block';
            contentArea.className = "grid-container";
            contentArea.innerHTML = '';

            if(subject.teachers.length === 0) contentArea.innerHTML = '<p>لا يوجد بيانات.</p>';

            subject.teachers.forEach((teacher, tIndex) => {
                contentArea.innerHTML += `
                    <div class="card" onclick="showFolders(${tIndex})">
                        <img src="${teacher.image}" class="card-img" alt="${teacher.name}">
                        <div class="card-body">
                            <div class="card-title">${teacher.name}</div>
                            <div class="card-desc">اضغط لعرض الكورسات</div>
                        </div>
                    </div>
                `;
            });
        }

        // 3. عرض المجلدات
        function showFolders(tIndex) {
            state.level = 'folders';
            state.teacherIdx = tIndex;
            const teacher = platformData[state.subjectIdx].teachers[tIndex];
            
            sectionTitle.innerText = `كورسات: ${teacher.name}`;
            contentArea.className = "grid-container";
            contentArea.innerHTML = '';

            if(!teacher.folders || teacher.folders.length === 0) {
                contentArea.innerHTML = '<p>لا يوجد كورسات حالياً.</p>';
                return;
            }

            teacher.folders.forEach((folder, fIndex) => {
                contentArea.innerHTML += `
                    <div class="card folder-card" onclick="showVideos(${fIndex})">
                        <img src="${folder.image}" class="card-img" alt="Folder">
                        <div class="card-body">
                            <div class="card-title">${folder.title}</div>
                            <div class="card-desc">${folder.videos.length} فيديوهات</div>
                        </div>
                    </div>
                `;
            });
        }

        // 4. عرض الفيديوهات
        function showVideos(fIndex) {
            state.level = 'videos';
            state.folderIdx = fIndex;
            const folder = platformData[state.subjectIdx].teachers[state.teacherIdx].folders[fIndex];
            
            sectionTitle.innerText = folder.title;
            contentArea.className = ""; 
            contentArea.innerHTML = '';

            folder.videos.forEach((video, vIndex) => {
                contentArea.innerHTML += `
                    <div class="video-wrapper">
                        <div class="plyr__video-embed" id="player-${vIndex}">
                            <iframe
                                src="https://www.youtube.com/embed/${video.vid}?origin=https://plyr.io&amp;iv_load_policy=3&amp;modestbranding=1&amp;playsinline=1&amp;showinfo=0&amp;rel=0&amp;enablejsapi=1"
                                allowfullscreen
                                allowtransparency
                                allow="autoplay"
                            ></iframe>
                        </div>
                        <div class="video-info">
                            <div class="video-title">🎥 ${video.title}</div>
                            <div class="video-desc">${video.desc}</div>
                        </div>
                    </div>
                `;
            });

            Plyr.setup('.plyr__video-embed', {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
                youtube: { noCookie: true, rel: 0, showinfo: 0, iv_load_policy: 3, modestbranding: 1 }
            });
        }

        // زرار الرجوع
        function goBack() {
            if (state.level === 'videos') {
                showFolders(state.teacherIdx);
            } else if (state.level === 'folders') {
                showTeachers(state.subjectIdx);
            } else if (state.level === 'teachers') {
                showSubjects();
            }
        }

        showSubjects(); // تشغيل
    </script>
</body>
</html>
