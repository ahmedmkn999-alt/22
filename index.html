<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FULL MARK TWO</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00e5ff;
            --bg-dark: #050505;
            --card-bg: #111111;
            --text-color: #ffffff;
            --glow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ==============================
           1. صفحة الترحيب (Welcome Screen)
           ============================== */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-in-out;
        }

        .welcome-logo-img {
            width: 200px; max-width: 80%; margin-bottom: 20px;
            filter: drop-shadow(0 0 15px var(--neon-blue)); 
            animation: pulse-img 3s infinite; border-radius: 20px;
        }

        .welcome-sub { color: #aaa; font-size: 1.2rem; margin-bottom: 40px; text-align: center; }

        .start-btn {
            padding: 15px 50px; border-radius: 50px;
            border: 2px solid var(--neon-blue);
            background: transparent; color: var(--neon-blue);
            font-weight: 800; font-size: 1.3rem; cursor: pointer;
            font-family: 'Cairo'; transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .start-btn:hover {
            background: var(--neon-blue); color: black;
            box-shadow: 0 0 40px var(--neon-blue); transform: scale(1.1);
        }

        @keyframes pulse-img {
            0% { filter: drop-shadow(0 0 15px var(--neon-blue)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 30px var(--neon-blue)); transform: scale(1.05); }
            100% { filter: drop-shadow(0 0 15px var(--neon-blue)); transform: scale(1); }
        }

        /* ==============================
           2. المنصة الداخلية
           ============================== */
        #platform-content { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px;
            animation: slideDown 1s ease-out;
        }

        .header-title { color: var(--neon-blue); margin: 0; font-weight: 800; font-size: 1.5rem; }

        #nav-controls { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        #back-btn {
            display: none; background: #333; color: white; border: none;
            padding: 8px 20px; border-radius: 50px; cursor: pointer; font-family: 'Cairo';
        }
        #back-btn:hover { background: var(--neon-blue); color: black; }
        #section-title { font-size: 1.3rem; font-weight: bold; }

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; padding-bottom: 50px;
            animation: fadeIn 1s ease-out;
        }

        .card {
            background: var(--card-bg); border-radius: 20px; overflow: hidden;
            border: 1px solid #222; transition: 0.4s; cursor: pointer; position: relative;
        }

        .card:hover {
            transform: translateY(-8px); border-color: var(--neon-blue); box-shadow: var(--glow);
        }

        .card-img { width: 100%; height: 180px; object-fit: cover; filter: brightness(0.7); transition:0.3s; }
        .card:hover .card-img { filter: brightness(1); }

        .card-body { padding: 20px; text-align: center; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .card-desc { font-size: 0.9rem; color: #888; }

        .video-wrapper {
            background: var(--card-bg); border-radius: 15px; overflow: hidden;
            margin-bottom: 30px; border: 1px solid #333;
        }
        .video-info { padding: 20px; }
        .plyr--video { --plyr-color-main: #00e5ff; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .loader {
            border: 4px solid #333; border-top: 4px solid var(--neon-blue);
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; display: none; margin-top: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #status-text { margin-top: 15px; color: #888; font-size: 0.9rem; display: none; }

    </style>
</head>
<body>

    <div id="welcome-screen">
        <img src="https://i.postimg.cc/XqDYNm4J/IMG-20260207-205632.jpg" alt="Full Mark Two Logo" class="welcome-logo-img">
        <div class="welcome-sub">منصتك التعليمية المتطورة</div>
        
        <button id="start-btn" class="start-btn" onclick="enterPlatform()">
            ابدأ رحلة التعلم 🚀
        </button>
        <div class="loader" id="loader"></div>
        <div id="status-text">جاري فحص وتحديث البيانات...</div>
    </div>

    <div id="platform-content">
        <header>
            <div class="header-title">💎 Full Mark 2</div>
        </header>

        <div id="nav-controls">
            <button id="back-btn" onclick="goBack()">🔙 رجوع</button>
            <div id="section-title">المواد الدراسية</div>
        </div>

        <div id="content-area" class="grid-container"></div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds",
            authDomain: "full-mark-8d434.firebaseapp.com",
            projectId: "full-mark-8d434",
            storageBucket: "full-mark-8d434.firebasestorage.app",
            messagingSenderId: "802579483999",
            appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea",
            measurementId: "G-26F9W89TB8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // 1. البيانات الاحتياطية (للحقن التلقائي)
        // ==========================================
        const initialData = [
          {
            name: "الفرنساوي",
            image: "https://i.postimg.cc/NjRcy2s0/a75e136b-7909-485f-95e8-862fddd2c0bc.png", 
            teachers: [
              {
                name: "مسيو انس السعيد",
                image: "https://i.postimg.cc/sDdy3JyV/lhctmi-Qt-ANEg0PDcec-CE1QTCqr-Kza-Eq-GZ6s-Zt-MJ4.jpg",
                folders: [ 
                  {
                    title: "كورس شرح المنهج 2026",
                    videos: [
                        { title: "جزء واحد تالتة ثانوي", desc: "بداية المنهج والقواعد الأساسية.", vid: "3PC1fxpp-Xk" },
                        { title: "جزء اتنين تالتة ثانوي", desc: "استكمال الشرح والتدريبات.", vid: "fVJTHj5YW7Y" },
                        { title: "جزء تلاتة تالتة ثانوي", desc: "شرح متقدم وملاحظات هامة.", vid: "Afx9AHypc7M" },
                        { title: "الجزء الاخير تالتة ثانوي", desc: "ختام المنهج والمراجعة.", vid: "6s_TWiP1KgQ" }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: "الإيطالي",
            image: "https://i.postimg.cc/VkX8S0fb/Hotels-near-the-Colosseum.jpg",
            teachers: [
              {
                name: "سنيور مدحت غانم",
                image: "https://i.postimg.cc/0NQ1VWGy/hqdefault.jpg",
                folders: [
                   {
                    title: "مراجعات ليلة الامتحان",
                    videos: [
                        { title: "الإنقاذ: منهج الإيطالي كاملاً", desc: "المنهج كله في 5 ساعات بس.", vid: "T6hpZH5AMnk" }
                    ]
                   }
                ]
              }
            ]
          },
          {
            name: "الألماني",
            image: "https://i.postimg.cc/bw1hGSyS/52023310-702.jpg",
            teachers: [
              {
                name: "هير ياسين ابو الزيد",
                image: "https://i.postimg.cc/MHkkKzCd/hqdefault-(1).jpg",
                folders: [
                    {
                        title: "كورس التأسيس والشرح",
                        videos: [
                            { title: "اللغة الألمانية - ج1", desc: "الأساسيات وقواعد النطق.", vid: "JOLc4Jc9yFU" },
                            { title: "اللغة الألمانية - ج2", desc: "الجراماتيك وتريكات الامتحانات.", vid: "L2irLAg7jHM" },
                            { title: "اللغة الألمانية - ج3", desc: "المواقف الحياتية.", vid: "I-3VLcEoCP8" },
                            { title: "اللغة الألمانية - ج4", desc: "حل تدريبات شاملة.", vid: "oRopKQ63a-I" }
                        ]
                    }
                ]
              }
            ]
          },
          {
            name: "الإسباني",
            image: "https://i.postimg.cc/L8jpqg95/250px-Flag-of-Spain-svg.png",
            teachers: [
              {
                name: "سنيور ماجد فارس",
                image: "https://i.postimg.cc/jdbVpdQ5/FB-IMG-1770239115997.jpg",
                folders: [
                    {
                        title: "المراجعة النهائية",
                        videos: [
                             { title: "شرح المنهج كاملاً", desc: "فيديو واحد فيه الخلاصة.", vid: "K9ZOydc1cqs" }
                        ]
                    }
                ]
              }
            ]
          }
        ];

        let platformData = [];
        let isDataLoaded = false;

        // ==========================================
        // 2. فحص الداتا والحقن التلقائي
        // ==========================================
        window.enterPlatform = async () => {
            const btn = document.getElementById('start-btn');
            const loader = document.getElementById('loader');
            const statusText = document.getElementById('status-text');

            if (!isDataLoaded) {
                btn.style.display = 'none';
                loader.style.display = 'block';
                statusText.style.display = 'block';
                
                // حاول تجيب الداتا
                await fetchAndInjectSubjects();
            }

            // الانتقال للمنصة
            const welcomeScreen = document.getElementById('welcome-screen');
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                document.getElementById('platform-content').style.display = 'block';
                renderSubjects();
            }, 800);
        };

        async function fetchAndInjectSubjects() {
            try {
                // 1. شوف فيه داتا ولا لأ
                const querySnapshot = await getDocs(collection(db, "subjects"));
                
                if (querySnapshot.empty) {
                    // مفيش داتا؟ ارفعها حالاً!
                    document.getElementById('status-text').innerText = "يتم رفع المواد لأول مرة...";
                    for (const subject of initialData) {
                        await addDoc(collection(db, "subjects"), subject);
                    }
                    platformData = initialData; // استخدم الداتا المحلية مؤقتاً
                } else {
                    // فيه داتا؟ هاتها
                    platformData = [];
                    querySnapshot.forEach((doc) => {
                        platformData.push(doc.data());
                    });
                }
                isDataLoaded = true;
            } catch (e) {
                console.error("Error:", e);
                alert("حدث خطأ في الاتصال");
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('loader').style.display = 'none';
                document.getElementById('status-text').style.display = 'none';
            }
        }

        // ==========================================
        // 3. نظام العرض (Render Logic)
        // ==========================================
        const contentArea = document.getElementById('content-area');
        const sectionTitle = document.getElementById('section-title');
        const backBtn = document.getElementById('back-btn');
        
        let state = { level: 'home', subIdx: null, teachIdx: null };

        window.renderSubjects = () => {
            state.level = 'home';
            sectionTitle.innerText = "المواد المتاحة";
            backBtn.style.display = 'none';
            contentArea.className = "grid-container";
            
            contentArea.innerHTML = platformData.map((sub, i) => `
                <div class="card" onclick="renderTeachers(${i})">
                    <img src="${sub.image}" class="card-img">
                    <div class="card-body">
                        <div class="card-title">${sub.name}</div>
                        <div class="card-desc">اضغط للدخول 📚</div>
                    </div>
                </div>
            `).join('');
        };

        window.renderTeachers = (i) => {
            state.level = 'teachers';
            state.subIdx = i;
            const sub = platformData[i];
            
            sectionTitle.innerText = `مدرسين مادة: ${sub.name}`;
            backBtn.style.display = 'block';
            
            contentArea.innerHTML = sub.teachers.map((t, ti) => `
                <div class="card" onclick="renderFolders(${ti})">
                    <img src="${t.image}" class="card-img">
                    <div class="card-body">
                        <div class="card-title">${t.name}</div>
                        <div class="card-desc">عرض الكورسات 👨‍🏫</div>
                    </div>
                </div>
            `).join('');
        };

        window.renderFolders = (ti) => {
            state.level = 'folders';
            state.teachIdx = ti;
            const teacher = platformData[state.subIdx].teachers[ti];
            
            sectionTitle.innerText = `كورسات: ${teacher.name}`;
            
            contentArea.innerHTML = teacher.folders.map((f, fi) => `
                <div class="card" onclick="renderVideos(${fi})">
                    <div style="padding:30px; font-size:4rem;">📁</div>
                    <div class="card-body">
                        <div class="card-title">${f.title}</div>
                        <div class="card-desc">${f.videos.length} فيديوهات 🎬</div>
                    </div>
                </div>
            `).join('');
        };

        window.renderVideos = (fi) => {
            state.level = 'videos';
            const folder = platformData[state.subIdx].teachers[state.teachIdx].folders[fi];
            
            sectionTitle.innerText = folder.title;
            contentArea.className = "";
            
            contentArea.innerHTML = folder.videos.map((v, vi) => `
                <div class="video-wrapper">
                    <div class="plyr__video-embed" id="player-${vi}">
                        <iframe src="https://www.youtube.com/embed/${v.vid}?origin=https://plyr.io&iv_load_policy=3&modestbranding=1&playsinline=1&showinfo=0&rel=0&enablejsapi=1" allowfullscreen allowtransparency allow="autoplay"></iframe>
                    </div>
                    <div class="video-info">
                        <div class="card-title">🎥 ${v.title}</div>
                        <div style="color:#aaa;">${v.desc}</div>
                    </div>
                </div>
            `).join('');

            Plyr.setup('.plyr__video-embed', { controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'] });
        };

        window.goBack = () => {
            if(state.level === 'videos') renderFolders(state.teachIdx);
            else if(state.level === 'folders') renderTeachers(state.subIdx);
            else if(state.level === 'teachers') renderSubjects();
        };

    </script>
</body>
                </html>
