    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        // إعدادات مشروعك (تأكد إنها مطابقة للموجودة في Console المشروع)
        const firebaseConfig = { 
            apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", 
            authDomain: "full-mark-8d434.firebaseapp.com", 
            projectId: "full-mark-8d434", 
            storageBucket: "full-mark-8d434.firebasestorage.app", 
            messagingSenderId: "802579483999", 
            appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" 
        };
        
        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            console.log("Firebase initialized successfully");
        } catch (error) {
            alert("مشكلة في إعدادات الفايربيز: " + error.message);
        }

        // --- نظام الدخول ---
        let countTimer;

        window.onload = function() {
            document.body.style.overflow = "auto";
            const savedUser = localStorage.getItem('fullmark_user');
            if(savedUser) { 
                startCountdown(); 
            } else { 
                document.getElementById('loginSection').style.display = 'flex'; 
            }
        };

        function checkCode() {
            const codeInput = document.getElementById('codeParams');
            const code = codeInput.value.trim();
            const msg = document.getElementById('loginMsg');
            const btn = document.querySelector('.login-btn');

            if(!code) { msg.innerText = "اكتب الكود!"; msg.style.display = 'block'; return; }
            
            btn.innerText = "جاري الاتصال...";
            msg.style.display = 'none';

            // 1. الكود السحري (للتجربة السريعة)
            if(code === '123456') {
                localStorage.setItem('fullmark_user', code);
                startCountdown();
                return;
            }

            // 2. الاتصال بفايربيز
            db.collection('codes').where('code', '==', code).get()
            .then((querySnapshot) => {
                if(querySnapshot.empty) {
                    // الاتصال نجح بس الكود مش موجود
                    msg.innerText = "❌ الكود ده مش متسجل عندنا!";
                    msg.style.display = 'block';
                    btn.innerText = "دخول";
                } else {
                    // الكود صح وموجود
                    localStorage.setItem('fullmark_user', code);
                    startCountdown();
                }
            })
            .catch((error) => {
                // حصل خطأ فني (غالباً Rules أو نت)
                console.error("Error getting documents: ", error);
                
                if (error.code === 'permission-denied') {
                    alert("⚠️ خطأ: قاعدة البيانات مقفولة (Permission Denied).\nلازم تغير الـ Rules في فايربيز وتخليها allow read: if true");
                } else if (error.code === 'unavailable') {
                    alert("⚠️ خطأ: مفيش نت أو الفايربيز محجوب.");
                } else {
                    alert("خطأ غير متوقع: " + error.message);
                }
                
                btn.innerText = "دخول";
            });
        }

        function startCountdown() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('welcomeSection').style.display = 'flex';
            
            let count = 5;
            const el = document.getElementById('counter');
            el.innerText = count;

            countTimer = setInterval(() => {
                count--;
                el.innerText = count;
                if(count <= 0) {
                    clearInterval(countTimer);
                    document.getElementById('welcomeSection').style.display = 'none';
                    document.getElementById('platformSection').style.display = 'block';
                    loadAndMerge();
                }
            }, 1000);
        }

        function cancelLogin() { clearInterval(countTimer); localStorage.removeItem('fullmark_user'); location.reload(); }
        function logout() { localStorage.removeItem('fullmark_user'); location.reload(); }

        // --- باقي الداتا والوظائف (زي ما هي) ---
        // ... (نفس الجزء بتاع platformData و renderSubjects من الكود اللي فات) ...
        
        // عشان متنسخش كود طويل تاني، الجزء اللي تحت ده هو هو اللي كان في الكود السابق
        // بس تأكد إنك حطيت platformData وباقي الدوال هنا
        
        let platformData = [
            {
                name: "اللغة العربية", img: "https://i.postimg.cc/L6xvnk5X/mn-awl-mn-tklm-allght-alʿrbyt.jpg",
                teachers: [{ name: "أ. محمد صلاح", img: "https://i.postimg.cc/ZRJy8gDR/FB-IMG-1770382315133.jpg", folders: [] }]
            },
            // ... باقي المواد
             {
            name: "اللغة الإنجليزية", img: "https://i.postimg.cc/TwvBCjry/characteristics-of-a-prestigious-language-school-1-1020x642-1.jpg",
            teachers: [{ name: "عبقري لغة", img: "https://files.coursatk.online/images/content/cc3fbcdbba91a2ed893fa92228b089a50eeced1fa245.jpg", folders: [] }, { name: "شريف المصري", img: "https://i.postimg.cc/4nRGtCBW/loginbg.png", folders: [] }]
            },
            {
                name: "الفيزياء", img: "https://i.postimg.cc/Z5RBj2mp/904.jpg",
                teachers: [{ name: "محمد عبد المعبود", img: "https://i.postimg.cc/fRTXpkcm/FB_IMG_1770383335913.jpg", folders: [] }, { name: "مستر كيرلس", img: "https://i.postimg.cc/qR0pD6nd/FB-IMG-1770383231786.jpg", folders: [] }]
            },
            {
                name: "الكيمياء", img: "https://static.vecteezy.com/system/resources/previews/014/472/954/original/chemistry-logo-template-illustration-free-vector.jpg",
                teachers: [
                    { name: "أ. محمد عبدالجواد", img: "https://files.coursatk.online/images/questions/23b4ebea27532d1d05b2f7de5f26e63add3e4ca8ffcd.jpg", folders: [] },
                    { name: "خالد صقر", img: "https://i.postimg.cc/hGQ0Zfn9/teacher_Bflsmq_Qf.webp", folders: [] }
                ]
            },
            {
                name: "الأحياء", img: "https://i.postimg.cc/cJjdZkVx/FB_IMG_1770384472698.jpg",
                teachers: [{ name: "د.أحمد الجوهري", img: "https://files.coursatk.online/images/content/a47130a2b11a514a2dbb766013d8e9f24701aae245ee.jpg", folders: [] }, { name: "محمد أيمن", img: "https://i.postimg.cc/856NCBS7/profile_433b1d2b5e7bfd30bed5.png", folders: [] }]
            },
            {
                name: "الرياضيات", img: "https://i.postimg.cc/yN0LYkGR/m-dah-alryadyat-alzamyt-fy-brytanya-ll-khd-balaqtsad-qdma.jpg",
                teachers: [{ name: "م.احمد عصام", img: "https://i.postimg.cc/fyRCK5RJ/essam_dark.png", folders: [] }, { name: "م. لطفي زهران", img: "https://i.postimg.cc/sXywB3Fh/Lotfy_a940b4e08c6abf7a6821.png", folders: [] }]
            },
            {
                name: "الجغرافيا", img: "https://files.coursatk.online/images/subjects/geography.png",
                teachers: [{ name: "جمعة السيد", img: "https://files.coursatk.online/images/content/2b233a89685a724df18a65c7b2ba6a3263f2932b3e8a.jpg", folders: [] }, { name: "أحمد زهران", img: "https://files.coursatk.online/images/questions/5eab71b642c6672b9182be0d1dd887beb3c8d2b98cf2.jpg", folders: [] }]
            },
            {
                name: "اللغات الثانية", img: "https://cdn-icons-png.flaticon.com/512/3898/3898082.png",
                teachers: [
                    { name: "فرنساوي (مسيو انس)", img: "https://i.postimg.cc/NjRcy2s0/a75e136b-7909-485f-95e8-862fddd2c0bc.png", folders: [
                        { title: "كورس شرح المنهج 2026", image: "https://cdn-icons-png.flaticon.com/512/3767/3767084.png", videos: [{title: "جزء واحد تالتة ثانوي", desc: "بداية المنهج والقواعد الأساسية.", vid: "3PC1fxpp-Xk"}, {title: "جزء اتنين تالتة ثانوي", desc: "استكمال الشرح والتدريبات.", vid: "fVJTHj5YW7Y"}] }
                    ]},
                    { name: "ألماني (هير ياسين)", img: "https://i.postimg.cc/bw1hGSyS/52023310-702.jpg", folders: [] },
                    { name: "إيطالي (سنيور مدحت)", img: "https://i.postimg.cc/0NQ1VWGy/hqdefault.jpg", folders: [{ title: "مراجعات", image: "https://cdn-icons-png.flaticon.com/512/2921/2921226.png", videos: [{title: "المنهج كامل", desc: "5 ساعات", vid: "T6hpZH5AMnk"}] }] },
                    { name: "إسباني (سنيور ماجد)", img: "https://i.postimg.cc/L8jpqg95/250px-Flag-of-Spain-svg.png", folders: [] }
                ]
            }
        ];

        async function loadAndMerge() {
            try {
                const snap = await db.collection('new_videos').get();
                snap.forEach(doc => {
                    const v = doc.data();
                    let sub = platformData.find(s => s.name === v.subject);
                    if(!sub) { sub = { name: v.subject, image: v.subImg || "https://cdn-icons-png.flaticon.com/512/2997/2997380.png", teachers: [] }; platformData.push(sub); }
                    let teacher = sub.teachers.find(t => t.name === v.teacher);
                    if(!teacher) { teacher = { name: v.teacher, image: v.techImg || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png", folders: [] }; sub.teachers.push(teacher); }
                    let folder = teacher.folders.find(f => f.title === v.course);
                    if(!folder) { folder = { title: v.course, image: "https://cdn-icons-png.flaticon.com/512/3767/3767084.png", videos: [] }; teacher.folders.push(folder); }
                    folder.videos.push({ title: v.videoName, desc: "تمت إضافته حديثاً", vid: v.videoLink });
                });
                renderSubjects();
            } catch(e) { console.log(e); renderSubjects(); }
        }

        const contentArea = document.getElementById('contentArea');
        const sectionTitle = document.getElementById('sectionTitle');
        const backBtn = document.getElementById('backBtn');
        let state = { level: 'subjects', subjectIdx: null, teacherIdx: null, folderIdx: null };

        function renderSubjects() {
            state.level = 'subjects';
            sectionTitle.innerText = "اختر المادة";
            backBtn.style.display = 'none';
            contentArea.className = "grid-container";
            contentArea.innerHTML = platformData.map((sub, i) => `
                <div class="card" onclick="renderTeachers(${i})">
                    <div class="card-img-container"><img src="${sub.image}" class="card-img"></div>
                    <div class="card-body"><div class="card-title">${sub.name}</div></div>
                </div>
            `).join('');
        }

        window.renderTeachers = function(idx) {
            state.level = 'teachers'; state.subjectIdx = idx;
            const sub = platformData[idx];
            sectionTitle.innerText = sub.name;
            backBtn.style.display = 'block';
            if(!sub.teachers || sub.teachers.length === 0) {
                contentArea.innerHTML = '<div class="empty-msg">قريباً</div>'; return;
            }
            contentArea.innerHTML = sub.teachers.map((t, i) => `
                <div class="card" onclick="renderFolders(${i})">
                    <div class="card-img-container"><img src="${t.image}" class="card-img"></div>
                    <div class="card-body"><div class="card-title">${t.name}</div></div>
                </div>
            `).join('');
        }

        window.renderFolders = function(idx) {
            state.level = 'folders'; state.teacherIdx = idx;
            const t = platformData[state.subjectIdx].teachers[idx];
            sectionTitle.innerText = t.name;
            if(!t.folders || t.folders.length === 0) {
                contentArea.innerHTML = '<div class="empty-msg">لا يوجد كورسات</div>'; return;
            }
            contentArea.innerHTML = t.folders.map((f, i) => `
                <div class="card folder-card" onclick="renderVideos(${i})">
                    <div class="card-img-container"><img src="${f.image}" class="card-img"></div>
                    <div class="card-body"><div class="card-title">${f.title}</div><div class="card-desc">${f.videos.length} فيديوهات</div></div>
                </div>
            `).join('');
        }

        window.renderVideos = function(idx) {
            state.level = 'videos'; state.folderIdx = idx;
            const f = platformData[state.subjectIdx].teachers[state.teacherIdx].folders[idx];
            sectionTitle.innerText = f.title;
            contentArea.className = "video-list";
            const userCode = localStorage.getItem('fullmark_user');

            if(!f.videos || f.videos.length === 0) {
                contentArea.innerHTML = '<div class="empty-msg">فارغ</div>'; return;
            }

            contentArea.innerHTML = f.videos.map((v, i) => `
                <div class="video-wrapper">
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                        <div class="video-desc">${v.desc}</div>
                    </div>
                    <div class="plyr__video-embed" id="player-${i}">
                        <iframe src="https://www.youtube.com/embed/${v.vid}?origin=https://plyr.io&iv_load_policy=3&modestbranding=1&playsinline=1&showinfo=0&rel=0&enablejsapi=1" allowfullscreen allowtransparency allow="autoplay"></iframe>
                        <div class="watermark">${userCode}</div>
                    </div>
                </div>
            `).join('');

            setTimeout(() => {
                f.videos.forEach((v, i) => { new Plyr(`#player-${i}`); });
            }, 500);
        }

        window.goBack = function() {
            if (state.level === 'videos') renderFolders(state.teacherIdx);
            else if (state.level === 'folders') renderTeachers(state.subjectIdx);
            else if (state.level === 'teachers') renderSubjects();
        }

        function openModal(id){ document.getElementById(id).style.display='flex'; }
        function closeModal(id){ document.getElementById(id).style.display='none'; }
        
        function openProfile() {
            openModal('profileModal');
            const u = localStorage.getItem('fullmark_user');
            if(u === '123456') { document.getElementById('pName').innerText = "زائر تجريبي"; document.getElementById('pCode').innerText=u; return; }
            db.collection('codes').where('code','==',u).get().then(s=>{
                if(!s.empty) { const d=s.docs[0].data(); document.getElementById('pName').innerText=d.studentName; document.getElementById('pCode').innerText=d.code; }
            });
        }

        function openSupport(){ openModal('supportModal'); loadChat(); }
        function sendMsg(){ 
            const t = document.getElementById('chatInput').value;
            const u = localStorage.getItem('fullmark_user');
            if(t) db.collection('support').doc(u).collection('msgs').add({text:t, sender:'me', time:new Date()});
            document.getElementById('chatInput').value='';
        }
        function loadChat(){
            const u = localStorage.getItem('fullmark_user');
            db.collection('support').doc(u).collection('msgs').orderBy('time').onSnapshot(s=>{
                const box = document.getElementById('chatBody'); box.innerHTML='';
                s.forEach(d=>{ const m=d.data(); box.innerHTML+=`<div class="msg ${m.sender}">${m.text}</div><br>`; });
            });
        }
    </script>
</body>
