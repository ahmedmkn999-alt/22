<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aperture — كاميرا المتصفح</title>
<style>
  :root{
    --bg:#0c0c0e;
    --panel:#17171a;
    --line:#2a2a2e;
    --text:#f2f1ec;
    --dim:#8a8a90;
    --accent:#c9ff3d;   /* electric lime — shutter / active state */
    --live:#ffcc4d;     /* warm amber ring — live-photo indicator */
    --danger:#ff5c5c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;user-select:none;}
  .mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.02em;}

  #app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

  /* ---- top bar ---- */
  #topbar{display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px calc(env(safe-area-inset-top) + 4px);
    padding-top:calc(env(safe-area-inset-top) + 10px);
    z-index:5;background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);}
  .brand{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
  .brand b{color:var(--text);font-weight:700;}
  #status{font-size:11px;color:var(--dim);}
  #liveBadge{display:none;align-items:center;gap:6px;background:rgba(0,0,0,.5);
    border:1px solid var(--live);color:var(--live);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.08em;}
  #liveBadge.on{display:flex;}
  #liveBadge .dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---- viewfinder ---- */
  #stage{flex:1;position:relative;background:#000;overflow:hidden;}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  canvas{display:none;}
  #hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:13px;text-align:center;padding:40px;line-height:1.7;}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .08s;}

  /* ---- filmstrip of filters ---- */
  #filters{position:absolute;bottom:0;left:0;right:0;z-index:4;
    display:flex;gap:10px;padding:10px 16px 14px;overflow-x:auto;
    background:linear-gradient(to top, rgba(0,0,0,.7), transparent);}
  #filters::-webkit-scrollbar{display:none;}
  .filterChip{flex:0 0 auto;padding:6px 14px;border-radius:20px;border:1px solid var(--line);
    background:rgba(23,23,26,.7);color:var(--dim);font-size:12px;letter-spacing:.04em;white-space:nowrap;}
  .filterChip.active{border-color:var(--accent);color:var(--accent);}

  /* ---- controls ---- */
  #controls{position:relative;z-index:5;background:var(--panel);border-top:1px solid var(--line);
    padding:18px 22px calc(env(safe-area-inset-bottom) + 18px);
    display:flex;align-items:center;justify-content:space-between;}

  #liveToggle{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);width:60px;}
  #liveToggle .ring{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;}
  #liveToggle.on{color:var(--live);}
  #liveToggle.on .ring{border-color:var(--live);}
  #liveToggle .ring::after{content:"";width:14px;height:14px;border-radius:50%;background:currentColor;opacity:.15;}
  #liveToggle.on .ring::after{opacity:1;}
  #liveToggle span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;}

  #shutterWrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
  #shutter{width:74px;height:74px;border-radius:50%;background:var(--accent);border:4px solid #fff;
    box-shadow:0 0 0 3px var(--bg);position:relative;}
  #shutter:active{transform:scale(.92);}
  #shutter.recording{background:var(--danger);}
  #shotCount{font-size:11px;color:var(--dim);}

  #flipCam{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);width:60px;}
  #flipCam .ring{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;}
  #flipCam span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;}

  /* ---- gallery / results tray ---- */
  #tray{position:absolute;bottom:0;left:0;right:0;background:var(--panel);
    border-top:1px solid var(--line);z-index:10;max-height:72%;
    transform:translateY(100%);transition:transform .28s ease;
    padding:0 16px calc(env(safe-area-inset-bottom) + 16px);overflow-y:auto;}
  #tray.open{transform:translateY(0);}
  #trayHead{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:14px 0;}
  #trayHead h3{margin:0;font-size:14px;letter-spacing:.04em;}
  #closeTray{color:var(--dim);font-size:13px;padding:6px 10px;}
  .shot{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#111113;}
  .shot img,.shot video{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#000;}
  .shot .meta{flex:1;min-width:0;}
  .shot .meta b{font-size:12px;display:block;}
  .shot .meta small{color:var(--dim);font-size:11px;}
  .shot .actions{display:flex;flex-direction:column;gap:6px;}
  .shot a{font-size:11px;color:var(--accent);border:1px solid var(--accent);padding:5px 10px;border-radius:16px;text-align:center;text-decoration:none;}
  .shot a.secondary{color:var(--dim);border-color:var(--line);}
  #galleryBtn{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:16px;z-index:5;
    background:rgba(0,0,0,.5);border:1px solid var(--line);color:var(--text);
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
  #galleryCount{position:absolute;top:-4px;left:-4px;background:var(--accent);color:#000;font-size:9px;
    width:16px;height:16px;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:700;}
  #galleryCount.show{display:flex;}
  #note{font-size:10.5px;color:var(--dim);text-align:center;padding:8px 20px 0;line-height:1.6;}
</style>
</head>
<body>
<div id="app">

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="flash"></div>
    <div id="hint">اضغط "تفعيل الكاميرا" وسمح للمتصفح بالوصول عشان تبدأ.<br>
      <button id="startBtn" style="margin-top:14px;background:var(--accent);border:none;color:#000;
        padding:10px 22px;border-radius:20px;font-weight:700;font-size:13px;">تفعيل الكاميرا</button>
    </div>

    <button id="galleryBtn">🖼<span id="galleryCount">0</span></button>

    <div id="topbar">
      <div class="brand">Aperture <span id="status" class="mono">جاهز</span></div>
      <div id="liveBadge"><span class="dot"></span>LIVE</div>
    </div>

    <div id="filters">
      <div class="filterChip active" data-f="none">عادي</div>
      <div class="filterChip" data-f="noir">نوار</div>
      <div class="filterChip" data-f="vivid">فيفيد</div>
      <div class="filterChip" data-f="warm">دافئ</div>
      <div class="filterChip" data-f="cool">بارد</div>
      <div class="filterChip" data-f="fade">فيد</div>
    </div>
  </div>

  <div id="controls">
    <div id="liveToggle">
      <div class="ring"></div>
      <span>لايف فوتو</span>
    </div>
    <div id="shutterWrap">
      <button id="shutter"></button>
      <div id="shotCount" class="mono">0 صورة</div>
    </div>
    <div id="flipCam">
      <div class="ring">⟲</div>
      <span>تبديل</span>
    </div>
  </div>

  <div id="note">الصور بتتحمّل كملفات — اضغط "حفظ" على أي صورة/كليب في المعرض عشان تنزّله على تليفونك. ده تطبيق متصفح، مش تطبيق مثبّت من الآب ستور.</div>

  <div id="tray">
    <div id="trayHead"><h3 class="mono">المعرض</h3><span id="closeTray">إغلاق ✕</span></div>
    <div id="shots"></div>
  </div>

</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const hint = document.getElementById('hint');
const statusEl = document.getElementById('status');
const shutter = document.getElementById('shutter');
const shotCount = document.getElementById('shotCount');
const liveToggle = document.getElementById('liveToggle');
const liveBadge = document.getElementById('liveBadge');
const flipCam = document.getElementById('flipCam');
const flash = document.getElementById('flash');
const tray = document.getElementById('tray');
const shotsEl = document.getElementById('shots');
const galleryBtn = document.getElementById('galleryBtn');
const galleryCount = document.getElementById('galleryCount');
const closeTray = document.getElementById('closeTray');

let stream = null;
let facing = 'user';
let liveMode = false;
let currentFilter = 'none';
let recorder = null;
let shots = [];

const FILTERS = {
  none:  '',
  noir:  'grayscale(1) contrast(1.15)',
  vivid: 'saturate(1.6) contrast(1.1)',
  warm:  'sepia(.25) saturate(1.3) hue-rotate(-8deg)',
  cool:  'saturate(1.2) hue-rotate(15deg) brightness(1.03)',
  fade:  'contrast(.85) saturate(.75) brightness(1.08)'
};

async function startCamera(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode: facing, width:{ideal:1280}, height:{ideal:1280} },
      audio:false
    });
    video.srcObject = stream;
    hint.style.display = 'none';
    statusEl.textContent = facing==='user' ? 'أمامية' : 'خلفية';
  }catch(e){
    statusEl.textContent = 'رفض الإذن';
    hint.style.display = 'flex';
    hint.querySelector('button') && (hint.querySelector('button').textContent = 'حاول تاني');
  }
}
startBtn.addEventListener('click', startCamera);

document.querySelectorAll('.filterChip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.filterChip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.f;
    video.style.filter = FILTERS[currentFilter];
  });
});

flipCam.addEventListener('click', ()=>{
  facing = facing==='user' ? 'environment' : 'user';
  startCamera();
});

liveToggle.addEventListener('click', ()=>{
  liveMode = !liveMode;
  liveToggle.classList.toggle('on', liveMode);
  liveBadge.classList.toggle('on', liveMode);
});

function doFlash(){
  flash.style.opacity = '0.85';
  setTimeout(()=> flash.style.opacity = '0', 90);
}

function capturePhotoBlob(){
  const w = video.videoWidth, h = video.videoHeight;
  canvas.width = w; canvas.height = h;
  ctx.filter = FILTERS[currentFilter] || 'none';
  // mirror if front camera, matches what user sees
  if(facing==='user'){ ctx.translate(w,0); ctx.scale(-1,1); }
  ctx.drawImage(video,0,0,w,h);
  ctx.setTransform(1,0,0,1,0,0);
  return new Promise(res=> canvas.toBlob(b=>res(b), 'image/jpeg', 0.92));
}

async function takeShot(){
  if(!stream) return;
  doFlash();
  const photoBlob = await capturePhotoBlob();
  const photoUrl = URL.createObjectURL(photoBlob);
  const stamp = new Date().toLocaleTimeString('ar-EG');

  if(!liveMode){
    addShot({ type:'photo', url:photoUrl, label:'صورة', stamp });
    return;
  }

  // live photo: record ~1.6s clip around the moment of capture
  shutter.classList.add('recording');
  const chunks = [];
  try{
    recorder = new MediaRecorder(stream, { mimeType: pickMime() });
    recorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
    recorder.onstop = () => {
      shutter.classList.remove('recording');
      const videoBlob = new Blob(chunks, { type: recorder.mimeType });
      const videoUrl = URL.createObjectURL(videoBlob);
      addShot({ type:'live', url:photoUrl, videoUrl, label:'لايف فوتو', stamp });
    };
    recorder.start();
    setTimeout(()=> recorder.state==='recording' && recorder.stop(), 1600);
  }catch(e){
    shutter.classList.remove('recording');
    addShot({ type:'photo', url:photoUrl, label:'صورة (اللايف مش مدعوم هنا)', stamp });
  }
}

function pickMime(){
  const opts = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  return opts.find(o=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(o)) || '';
}

function addShot(shot){
  shots.unshift(shot);
  shotCount.textContent = shots.length + ' صورة';
  galleryCount.textContent = shots.length;
  galleryCount.classList.add('show');
  renderTray();
}

function renderTray(){
  shotsEl.innerHTML = '';
  shots.forEach((s, i)=>{
    const row = document.createElement('div');
    row.className = 'shot';
    row.innerHTML = `
      <img src="${s.url}" alt="shot">
      <div class="meta"><b>${s.label} #${shots.length - i}</b><small class="mono">${s.stamp}</small></div>
      <div class="actions">
        <a download="aperture-photo-${i}.jpg" href="${s.url}">حفظ الصورة</a>
        ${s.videoUrl ? `<a class="secondary" download="aperture-live-${i}.webm" href="${s.videoUrl}">حفظ الكليب</a>` : ''}
      </div>`;
    shotsEl.appendChild(row);
  });
}

shutter.addEventListener('click', takeShot);
galleryBtn.addEventListener('click', ()=> tray.classList.add('open'));
closeTray.addEventListener('click', ()=> tray.classList.remove('open'));
</script>
</body>
</html>
